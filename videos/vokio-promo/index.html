<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F4F1E8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-accroche"
        class="scene"
        data-composition-id="01-accroche"
        data-composition-src="compositions/frames/01-accroche.html"
        data-start="0"
        data-duration="4.2"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-accroche-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="4.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-probleme"
        class="scene"
        data-composition-id="02-probleme"
        data-composition-src="compositions/frames/02-probleme.html"
        data-start="4.2"
        data-duration="5.3"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-probleme-voice"
        src="assets/voice/02.wav"
        data-start="4.2"
        data-duration="4.8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-decroche"
        class="scene"
        data-composition-id="03-decroche"
        data-composition-src="compositions/frames/03-decroche.html"
        data-start="9"
        data-duration="5.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-decroche-voice"
        src="assets/voice/03.wav"
        data-start="9"
        data-duration="5.4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-agenda"
        class="scene"
        data-composition-id="04-agenda"
        data-composition-src="compositions/frames/04-agenda.html"
        data-start="14.4"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-agenda-voice"
        src="assets/voice/04.wav"
        data-start="14.4"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-preuve"
        class="scene"
        data-composition-id="05-preuve"
        data-composition-src="compositions/frames/05-preuve.html"
        data-start="20.4"
        data-duration="5.6"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-preuve-voice"
        src="assets/voice/05.wav"
        data-start="20.4"
        data-duration="5.6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="26"
        data-duration="4"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-cta-voice"
        src="assets/voice/06.wav"
        data-start="26"
        data-duration="4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/musique.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.18"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="30"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-probleme", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.fromTo("#el-03-decroche", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
