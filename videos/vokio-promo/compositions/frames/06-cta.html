<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>

    /* the frame root is styled by #root — never by a class on it */
    #root{

      width:100%;
      height:100%;
      overflow:hidden;
      container-type:size;
      font-kerning:normal;

    /* ids begin with a digit, so every frame selector is an attribute selector
       (a leading-digit #id / .class selector is invalid CSS and would be dropped) */

    /* — full-bleed ground: paper + one sun bloom + a subordinate ember counter-bloom — */
    [id="06-cta-ground"]{
      position:absolute;
      inset:0;
      background:
        radial-gradient(52% 28% at 50% 30%,
          rgba(239,164,36,0.18) 0%,

    }

    [id="06-cta-stage"]{
      position:absolute;
      inset:0;
    }

    /* — the wave: the four ink bars (the solar centre bar IS the wordmark's dot) — */
    [id="06-cta-wave"]{
      position:absolute;
      left:309.6px;
      top:324.4px;
      width:460.8px;
      height:460.8px;
      overflow:visible;

      stroke-width:5.5;

    /* — the wordmark: the live site's own .vk-word treatment — */
    [id="06-cta-lockup"]{

    [id="06-cta-dot"]{

  <div

    data-composition-id="06-cta"
    data-duration="4"
    data-width="1080"

  >
    <div id="06-cta-ground" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>

          <line id="06-cta-bar-42" x1="42" y1="24" x2="42" y2="50"></line>
          <line id="06-cta-bar-52" x1="52" y1="8" x2="52" y2="50"></line>
        </svg>
      </div>

      <div id="06-cta-lockup"><span id="06-cta-word"><span class="seg" id="06-cta-seg-a">Vok</span><span class="glyph-i"><span class="seg" id="06-cta-seg-b">&#x131;</span><span id="06-cta-dot"><svg viewBox="0 0 11 11" fill="none" aria-hidden="true"><line id="06-cta-solar" x1="5.5" y1="5.5" x2="5.5" y2="5.5"></line></svg><span id="06-cta-dot-ring"></span></span></span><span class="seg" id="06-cta-seg-c">o</span></span></div>

      <div id="06-cta-line2"><span class="w">Ne</span><span class="w">ratez</span><span class="w">plus</span><span class="w">un</span><span class="w">seul</span><span class="w">appel.</span></div>

      <div id="06-cta-line3">vokio.fr &#183; Votre num&#233;ro ne change pas</div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var byId = function (id) { return document.getElementById(id); };
      var solar = byId("06-cta-solar");
      var dot = byId("06-cta-dot");
      var ring = byId("06-cta-dot-ring");
      var segA = byId("06-cta-seg-a");
      var segB = byId("06-cta-seg-b");
      var segC = byId("06-cta-seg-c");
      var line2Words = byId("06-cta-line2").querySelectorAll(".w");
      var line3 = byId("06-cta-line3");
      var outer = [byId("06-cta-bar-12"), byId("06-cta-bar-52")];
      var inner = [byId("06-cta-bar-22"), byId("06-cta-bar-42")];

      /* The solar object's offset that seats it back on the wave's centre bar.
         wave box: left 309.6px, top 324.4px, 460.8px  ->  1 viewBox unit = 7.2px,
         so the bar's 5.5u stroke is exactly the dot's 0.11em. Centre bar x=32 sits at
         540px and its foot (y=50) at 684.4px, the wordmark's own baseline.
         Rest centre of the dot box, measured: 684.91px / 466.59px. */
      var DX = -144.92;
      var DY = 217.80;

      var SHUT = "inset(-28% 100% -28% 0%)";
      var OPEN = "inset(-28% 0% -28% 0%)";

      /* ---- Scene 1 (0.00-0.75) — the wave, still alive, sheds its four ink bars ---- */

      /* the inner pair is still breathing when the frame opens */
      tl.fromTo(inner, { attr: { y1: 27 } },
        { attr: { y1: 19 }, duration: 0.18, ease: "power1.inOut" }, 0.0);

      /* outermost pair first (x=12 and x=52): they lower, then go */
      tl.fromTo(outer, { attr: { y1: 6 } },
        { attr: { y1: 50 }, duration: 0.26, ease: "power2.in" }, 0.03);
      tl.to(outer, { opacity: 0, duration: 0.09, ease: "power1.in" }, 0.21);

      /* then the inner pair (x=22 and x=42), working inward */
      tl.to(inner, { attr: { y1: 50 }, duration: 0.26, ease: "power2.in" }, 0.20);
      tl.to(inner, { opacity: 0, duration: 0.09, ease: "power1.in" }, 0.38);

      /* the surviving solar bar keeps breathing alone — finite, hand-placed, no loop */
      tl.fromTo(solar, { attr: { y1: -15.2 } },
        { attr: { y1: -21.0 }, duration: 0.22, ease: "power1.inOut" }, 0.0);
      tl.to(solar, { attr: { y1: -16.1 }, duration: 0.22, ease: "power1.inOut" }, 0.22);
      tl.to(solar, { attr: { y1: -18.5 }, duration: 0.19, ease: "power2.out" }, 0.44);

      /* ---- Scene 2 (0.75-1.60) — the bar contracts to a dot and rides up into the i
              while the word writes itself below. The two motions cross. ---- */

      /* the dot object holds its wave seat from frame one, then travels */
      tl.fromTo(dot, { x: DX, y: DY },
        { x: 0, y: 0, duration: 0.40, ease: "power3.inOut" }, 0.73);
      /* same start, same duration, same ease: one morph, round cap -> round dot */
      tl.to(solar, { attr: { y1: 5.5 }, duration: 0.40, ease: "power3.inOut" }, 0.73);

      /* "Vokio" writes itself left to right at a constant pen speed, the i dotless */
      tl.fromTo(segA, { clipPath: SHUT },
        { clipPath: OPEN, duration: 0.28, ease: "none" }, 0.66);
      tl.fromTo(segB, { clipPath: SHUT },
        { clipPath: OPEN, duration: 0.08, ease: "none" }, 0.94);
      tl.fromTo(segC, { clipPath: SHUT },
        { clipPath: OPEN, duration: 0.12, ease: "none" }, 1.02);

      /* ---- Scene 3 (1.60-2.80) — the line lands under the lockup, word by word ---- */
      tl.fromTo(line2Words, { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power3.out", stagger: 0.06 }, 1.60);

      /* the dot's single closing pulse — one finite tween, like the site's, then done */
      tl.fromTo(ring, { opacity: 0.5, scale: 1 },
        { opacity: 0, scale: 3.2, duration: 0.60, ease: "power2.out", immediateRender: false }, 2.35);

      /* ---- Scene 4 (2.80-4.00) — the address, then a dead-still last second ---- */
      tl.fromTo(line3, { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.20, ease: "power3.out" }, 2.80);

      /* nothing moves from 3.00 to 4.00 — this frame is also the thumbnail */
      tl.to({}, { duration: 4.0 }, 0);

      window.__timelines["06-cta"] = tl;
      tl.seek(0);
    })();
  </script>
