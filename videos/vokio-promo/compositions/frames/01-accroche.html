  <div id="root" data-composition-id="01-accroche" data-width="1080" data-height="1920">

    <div class="f01-line f01-line-1" id="01-accroche-line-1">
      <span class="f01-measure">
        <span class="f01-row">
          <span class="f01-w" data-layout-allow-overlap id="01-accroche-l1-w0">Les</span>

  <script>
    (function () {
      var byId = function (id) { return document.getElementById(id); };

      /* ── dynamic-content-sequencing : the word beats are reduced ONCE, at
         build time, into a flat table of absolute start times. Nothing is
         recomputed while the timeline runs. ─────────────────────────────── */
      var WORD_REVEAL_DUR = 0.78;   /* long deceleration */
      var WORD_RISE = 34;

      var BEATS = [
        { id: "01-accroche-l1-w0", at: 0.04 },
        { id: "01-accroche-l1-w1", at: 0.19 },
        { id: "01-accroche-l1-w2", at: 0.54 },
        { id: "01-accroche-l1-w3", at: 0.77 },
        { id: "01-accroche-l1-w4", at: 0.90 },
        { id: "01-accroche-l2-w0", at: 1.36 },
        { id: "01-accroche-l2-w1", at: 1.48 },
        { id: "01-accroche-l2-w2", at: 2.03 }
      ];

      var line1 = byId("01-accroche-line-1");
      var halo  = byId("01-accroche-halo");
      var chip  = byId("01-accroche-chip");

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.00–1.35) + Scene 2 second line (1.36–2.60) :
         word-by-word arrival on the real spoken words. */
      for (var i = 0; i < BEATS.length; i++) {
        tl.fromTo(
          byId(BEATS[i].id),
          { opacity: 0, y: WORD_RISE, filter: "blur(7px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: WORD_REVEAL_DUR, ease: "power3.out" },
          BEATS[i].at
        );
      }

      /* Scene 2 (1.35–2.60) : line 1 steps down one notch and drops to the
         headline-sm rung. Scale + position only, no cross-fade. */
      tl.fromTo(
        line1,
        { y: 0, scale: 1 },
        { y: 78, scale: 0.27, duration: 0.72, ease: "power3.out" },
        1.35
      );

      /* Scene 3 (2.60–4.20) : the type freezes; the incoming-call chip
         arrives on a damped spring-pop (power3, no overshoot) and the solar
         bloom opens behind it. */
      tl.fromTo(
        chip,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
        2.60
      );

      tl.fromTo(
        halo,
        { scale: 0.58, opacity: 0 },
        { scale: 1, opacity: 0.5, duration: 0.35, ease: "power3.out" },
        2.55
      );

      /* Two pulses, placed by hand as four finite tweens. No repeat, no yoyo. */
      tl.to(halo, { scale: 1.11, opacity: 0.74, duration: 0.35, ease: "power2.out" }, 2.90);
      tl.to(halo, { scale: 1.00, opacity: 0.50, duration: 0.30, ease: "power2.inOut" }, 3.25);
      tl.to(halo, { scale: 1.11, opacity: 0.74, duration: 0.25, ease: "power2.out" }, 3.60);
      tl.to(halo, { scale: 1.00, opacity: 0.50, duration: 0.25, ease: "power2.inOut" }, 3.85);

      /* hold to the full frame duration */
      tl.to({}, { duration: 0.1 }, 4.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-accroche"] = tl;
    })();
  </script>
