  <div id="root" data-composition-id="02-probleme" data-width="1080" data-height="1920" data-duration="5.3">
    <!-- track 0 · full-bleed paper ground + atmospheric haze -->
    <div id="02-probleme-ground" class="clip f02p-ground" data-start="0" data-duration="5.3" data-track-index="0">
      <div id="02-probleme-haze" class="f02p-haze"></div>
    </div>

    <!-- track 1 · the statement -->
    <div id="02-probleme-headline" class="clip f02p-headline" data-start="0" data-duration="5.3" data-track-index="1">
      <div class="f02p-hl"><span id="02-probleme-w0" class="f02p-w">Vous</span> <span id="02-probleme-w1" class="f02p-w">ne</span></div>
      <div class="f02p-hl"><span id="02-probleme-w2" class="f02p-w">décrochez</span></div>
      <div class="f02p-hl"><span id="02-probleme-w3" class="f02p-w">pas.</span></div>
    </div>

    <!-- track 2 · the list that takes the call's place -->
    <div id="02-probleme-list-jitter" class="clip f02p-list" data-start="0" data-duration="5.3" data-track-index="2">
      <div id="02-probleme-row3-fill" class="f02p-row3-fill"></div>
      <div id="02-probleme-row1-name" class="f02p-row-name">
        <span id="02-probleme-vous" class="f02p-vous">Vous<i id="02-probleme-vous-strike" class="f02p-vous-strike"></i></span>
      </div>
      <div id="02-probleme-row2-name" class="f02p-row-name f02p-row-name-2">
        <span class="f02p-vous">Artisan suivant</span>
      </div>
      <div id="02-probleme-row3-name" class="f02p-row-name f02p-row-name-3">
        <span class="f02p-vous">Artisan suivant</span>
      </div>
      <svg id="02-probleme-rule1" class="f02p-rule f02p-rule-1" viewBox="0 0 904 2" xmlns="http://www.w3.org/2000/svg">
        <path id="02-probleme-rule1-path" d="M 0 1 L 904 1" />
      </svg>
      <svg id="02-probleme-rule2" class="f02p-rule f02p-rule-2" viewBox="0 0 904 2" xmlns="http://www.w3.org/2000/svg">
        <path id="02-probleme-rule2-path" d="M 0 1 L 904 1" />
      </svg>
      <svg id="02-probleme-rule3" class="f02p-rule f02p-rule-3" viewBox="0 0 904 2" xmlns="http://www.w3.org/2000/svg">
        <path id="02-probleme-rule3-path" d="M 0 1 L 904 1" />
      </svg>
    </div>

    <!-- track 3 · the inherited incoming-call chip, dying on screen -->
    <div id="02-probleme-chip" class="clip f02p-chip" data-start="0" data-duration="5.3" data-track-index="3">
      <div id="02-probleme-halo" class="f02p-halo"></div>
      <div id="02-probleme-chip-ink" class="f02p-chip-ink">
        <span id="02-probleme-chip-label" class="f02p-chip-label">Appel entrant</span>
        <span class="f02p-chip-rule"></span>
        <span id="02-probleme-chip-time" class="f02p-chip-time">02:07</span>
      </div>
      <svg id="02-probleme-strike-svg" class="f02p-strike-svg" viewBox="0 0 640 12" xmlns="http://www.w3.org/2000/svg">
        <path id="02-probleme-strike" class="f02p-strike-path" d="M 0 6 L 640 6" />
      </svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "02-probleme";
      // getElementById, never querySelector — these ids begin with a digit.
      var q = function (name) { return document.getElementById(ID + "-" + name); };

      // svg-path-draw setup — measured geometry, dash pattern laid in before any tween.
      var measure = function (pathEl, fallback) {
        var len = fallback;
        if (pathEl && typeof pathEl.getTotalLength === "function") {
          var m = pathEl.getTotalLength();
          if (m && isFinite(m) && m > 1) { len = m; }
        }
        if (pathEl) {
          pathEl.style.strokeDasharray = String(len);
          pathEl.style.strokeDashoffset = String(len);
        }
        return len;
      };

      var strike = q("strike");
      var rule1 = q("rule1-path");
      var rule2 = q("rule2-path");
      var rule3 = q("rule3-path");

      var strikeLen = measure(strike, 640);
      var rule1Len = measure(rule1, 904);
      var rule2Len = measure(rule2, 904);
      var rule3Len = measure(rule3, 904);

      var tl = gsap.timeline({ paused: true });

      /* --------- Scene 1 (0.00–1.05) — the inherited call, and the word that kills it ---------
         The chip is already on screen at x 50% / y 62%, scale 1, opacity 1. It never re-enters.
         Its halo is still breathing: finite, hand-placed tweens, no repeat / no yoyo. */
      tl.fromTo(q("halo"),
        { scale: 1, opacity: 1 },
        { scale: 1.055, opacity: 0.84, duration: 0.47, ease: "sine.inOut" }, 0);
      tl.to(q("halo"), { scale: 1, opacity: 1, duration: 0.45, ease: "sine.inOut" }, 0.47);

      // "Vous ne décrochez pas." lands word by word, on the real voice:
      // Vous 0.04 · ne 0.24 · décrochez 0.36 · pas. 0.95
      tl.fromTo(q("w0"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.72, ease: "power3.out" }, 0.04);
      tl.fromTo(q("w1"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.72, ease: "power3.out" }, 0.24);
      tl.fromTo(q("w2"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.72, ease: "power3.out" }, 0.36);
      tl.fromTo(q("w3"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 0.95);

      // 0.95 — "pas." lands and the halo goes OUT on the same frame. The hard cut of the film.
      tl.to(q("halo"), { opacity: 0, scale: 0.9, duration: 0.09, ease: "power4.out" }, 0.95);
      // the paper goes cold with it
      tl.to(q("haze"), { opacity: 0.3, duration: 0.26, ease: "power2.out" }, 0.95);
      // the chip loses its solar and keeps only pale ink
      tl.to(q("chip-ink"), { opacity: 0.42, duration: 0.14, ease: "power3.out" }, 0.95);

      /* --------- Scene 2 (1.05–2.90) — struck through, lifted out, replaced --------- */
      // svg-path-draw, left → right, across the chip
      tl.fromTo(strike,
        { strokeDashoffset: strikeLen },
        { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" }, 1.05);

      // the chip slides up out of the useful frame while the line is still drawing
      tl.to(q("chip"), { y: -332, duration: 0.95, ease: "power2.inOut" }, 1.28);
      tl.to(q("chip"), { opacity: 0, duration: 0.62, ease: "power2.in" }, 1.62);

      // three hairline rows write themselves, one per beat: "client" 1.37 · "appelle" 1.70 · "suivant" 2.21
      tl.fromTo(rule1, { strokeDashoffset: rule1Len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.37);
      tl.fromTo(q("row1-name"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.45);
      tl.fromTo(q("vous-strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power2.out" }, 1.62);
      tl.fromTo(rule2, { strokeDashoffset: rule2Len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.70);
      tl.fromTo(q("row2-name"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.78);
      tl.fromTo(rule3, { strokeDashoffset: rule3Len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.21);
      tl.fromTo(q("row3-name"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.29);

      /* --------- Scene 3 (2.90–5.30) — the third row lights up, then nothing --------- */
      // the single solar moment of the frame: the row nobody is named in
      tl.fromTo(q("row3-fill"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.62, ease: "power3.out" }, 2.89);
      tl.fromTo(rule3,
        { stroke: "rgba(38,32,25,0.2)" },
        { stroke: "#EFA424", duration: 0.2, ease: "power2.out" }, 2.89);

      // sine-wave-loop, low register: 2.2px, ~2.9s period, amplitude enveloped to zero at the tail
      // so the frame is visibly STILL when the cut to frame 3 arrives at 5.30.
      var phase = { p: 0 };
      var CYCLES = 0.74;
      var TOTAL = Math.PI * 2 * CYCLES;
      var listEl = q("list-jitter");
      tl.to(phase, {
        p: TOTAL,
        duration: 2.15,
        ease: "none",
        onUpdate: function () {
          var t = phase.p / TOTAL;
          var env = t < 0.8 ? 1 : (1 - t) / 0.2;
          listEl.style.transform = "translateY(" + (Math.sin(phase.p) * 2.2 * env).toFixed(3) + "px)";
        }
      }, 3.15);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
</template>
