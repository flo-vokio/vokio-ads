  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById(id);
      };

      /* The real screen moves a booking with `transition: top .18s ease`.
         GSAP has no built-in CSS `ease`, so the curve is solved here:
         cubic-bezier(.25,.1,.25,1). No overshoot, no settle bounce. */
      var cssEase = (function () {
        var x1 = 0.25, y1 = 0.1, x2 = 0.25, y2 = 1;
        var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        function fx(t) { return ((ax * t + bx) * t + cx) * t; }
        function dfx(t) { return (3 * ax * t + 2 * bx) * t + cx; }
        return function (p) {
          var t = p, i, x, d;
          for (i = 0; i < 8; i++) {
            x = fx(t) - p;
            if (x < 0) { x = -x; }
            if (x < 1e-6) { break; }
            d = dfx(t);
            if (d < 1e-6 && d > -1e-6) { break; }
            t -= (fx(t) - p) / d;
          }
          if (t < 0) { t = 0; }
          if (t > 1) { t = 1; }
          return ((ay * t + by) * t + cy) * t;
        };
      })();

      /* svg-path-draw : the dash pattern comes from the measured geometry */
      var LINE_IDS = [
        "04-agenda-line-0",
        "04-agenda-line-1",
        "04-agenda-line-2",
        "04-agenda-line-3",
        "04-agenda-line-4"
      ];
      var lines = LINE_IDS.map(byId);
      lines.forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      /* viewport-change, focus-lock form : one state object, one writer.
         The solar rule descends the day column and locks softly onto the
         08:00–10:00 band, coming to rest on the 08:30 line. */
      var scanEl = byId("04-agenda-scan");
      var scan = { y: 0 };
      function applyScan() {
        scanEl.style.transform = "translate3d(0px," + scan.y + "px,0px)";
      }
      applyScan();

      var HOUR_08 = 402.325; /* the 08:00 rule, in day-column space */
      var HALF_08 = 502.4;   /* the 08:30 line — where the booking lands */

      var tl = gsap.timeline({ paused: true });

      /* ——— Scene 1 (0.00–0.95) : the thread docks left, the grid draws ——— */
      tl.fromTo(
        byId("04-agenda-thread"),
        { x: 86, y: 64, scale: 1.28, opacity: 1 },
        { x: 0, y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        0
      );

      tl.fromTo(
        byId("04-agenda-field"),
        { opacity: 0 },
        { opacity: 1, duration: 0.46, ease: "power2.out" },
        0.2
      );
      tl.fromTo(
        byId("04-agenda-dayhead"),
        { opacity: 0 },
        { opacity: 1, duration: 0.46, ease: "power1.out" },
        0.2
      );

      var DRAW_START = 0.28;
      var DRAW_DUR = 0.18;
      var DRAW_STEP = 0.125;
      lines.forEach(function (p, i) {
        var at = DRAW_START + i * DRAW_STEP;
        tl.to(p, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" }, at);
        tl.fromTo(
          byId("04-agenda-hour-" + i),
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power1.out" },
          at
        );
      });

      /* ——— Scene 2 (0.95–2.70) : the solar rule scans, and nothing else moves ——— */
      tl.fromTo(
        byId("04-agenda-scanwrap"),
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "power1.out" },
        1.51
      );
      tl.fromTo(
        scan,
        { y: 0 },
        { y: HOUR_08, duration: 0.39, ease: "power2.in", immediateRender: false, onUpdate: applyScan },
        1.51
      );
      tl.fromTo(
        scan,
        { y: HOUR_08 },
        { y: HALF_08, duration: 0.28, ease: "power3.out", immediateRender: false, onUpdate: applyScan },
        1.9
      );

      /* ——— Scene 3 (2.70–4.20) : the booking lands. 0.18s, CSS `ease`, no bounce ——— */
      tl.fromTo(
        byId("04-agenda-card"),
        { y: -62, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.18, ease: cssEase },
        2.7
      );
      tl.to(
        byId("04-agenda-scanwrap"),
        { opacity: 0, duration: 0.31, ease: "power1.out" },
        2.89
      );

      /* ——— Scene 4 (4.20–6.00) : held read. Nothing moves. ——— */
      tl.to({ hold: 0 }, { hold: 1, duration: 0.001 }, 5.999);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-agenda"] = tl;
      tl.seek(0);
    })();
  </script>
