<!-- Situation « lb-lampe » (dentiste, lot B), vue du fauteuil : la lampe, tournée vers le haut, recule d'un rien puis
     pivote sur sa fourche vers nous (on voit sa face grandir en perspective), dépasse, se pose ; elle s'allume en clignant
     et ses rayons poussent. Le coup d'arrêt fait plonger le bras et balancer le miroir dentaire qui y est accroché
     (pendule amorti). Animé par lb-lampe.js (fonction pure du temps, sur 10 s : la lampe s'éteint et se relève pendant que
     la situation est cachée). -->
