<!-- Situation « lb-vernis » (onglerie, lot B) : un doigt vu de dessus ; le pinceau se pose et tire le vernis de la cuticule
     au bout de l'ongle (les poils plient dans le sens du geste), se relève : un fil de vernis s'étire, casse, et la goutte
     perle au bout du pinceau (elle tremble, amortie) ; puis la lampe UV s'allume en clignant et ses rayons tombent sur
     l'ongle, qui brille. Animé par lb-vernis.js (fonction pure du temps, sur 10 s : tout se remet en place, caché). -->
