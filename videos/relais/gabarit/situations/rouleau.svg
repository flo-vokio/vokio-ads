<!-- Situation « rouleau » (boulangerie, un fraisier pour samedi) : une boule de pâte sur le plan fariné ; le rouleau prend
     son élan, s'abat sur la pâte qui S'ÉCRASE (elle s'étale, volume conservé), un nuage de farine part des deux côtés,
     le rouleau roule en l'étalant encore, se relève, et la pâte SE REPLIE à moitié (elle se rétracte, un pli se forme).
     Animé par rouleau.js (lib/fx.js). -->
<svg id="objet" viewBox="0 0 600 600" aria-hidden="true" data-periode="1.25" style="overflow:visible;left:-30px;top:130px;width:720px;height:720px">
  <rect x="30" y="470" width="470" height="34" rx="8" fill="#E6D9C0" stroke="#262019" stroke-width="7"/>
  <g fill="#FFFFFF" stroke="#B3AB9E" stroke-width="2">
    <ellipse cx="120" cy="466" rx="34" ry="5"/><ellipse cx="410" cy="466" rx="40" ry="5"/>
    <circle cx="80" cy="462" r="4"/><circle cx="452" cy="461" r="3.5"/><circle cx="470" cy="464" r="3"/><circle cx="64" cy="464" r="3"/></g>
  <path id="ro-pate" fill="#EFE3CB" stroke="#262019" stroke-width="7" stroke-linejoin="round"/>
  <path id="ro-pli" fill="none" stroke="#262019" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <g id="ro-rouleau">
    <rect x="-150" y="-30" width="300" height="60" rx="26" fill="#E6D9C0" stroke="#262019" stroke-width="7"/>
    <g id="ro-veines" stroke="#262019" stroke-width="3.5" stroke-linecap="round" opacity=".35"></g>
    <rect x="-212" y="-12" width="70" height="24" rx="12" fill="#262019"/>
    <rect x="142" y="-12" width="70" height="24" rx="12" fill="#262019"/>
  </g>
  <g id="ro-fx"></g>
</svg>
