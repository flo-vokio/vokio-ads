<!-- Situation « clé » (plombier, fuite sous l'évier) : sous l'évier (cuve, bonde, tuyau d'évacuation vers le mur), l'écrou du
     raccord vu de face ; une goutte (solaire, pour se lire tout de suite) perle sous le raccord et tombe ; la clé à molette serre l'écrou DANS LE BON SENS : rotation horaire vue de face (le filetage part vers
     le mur), mâchoire MOBILE du côté où l'on tire (en haut, le manche remonte), mâchoire fixe en bas ; 60° d'un coup, puis la
     goutte s'arrête. Animé par cle.js (lib/fx.js). -->
