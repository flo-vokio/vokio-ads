<!-- Situation « lb-gerbe » (fleuriste, lot B, ton sobre) : une gerbe ; le ruban noue lentement ses deux boucles autour des
     tiges (les pans remontent d'autant, puis se balancent à peine), et une feuille se détache et descend en se balançant.
     Aucun trait de vitesse, aucun écrasement : un geste lent. Animé par lb-gerbe.js (fonction pure du temps, sur 10 s : le
     nœud se défait et la feuille se remet en place pendant que la situation est cachée). -->
