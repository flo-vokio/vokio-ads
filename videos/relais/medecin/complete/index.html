    <script>
/* Animateur de la situation « lb-stetho » (médecin, lot B). SITUATION_ANIM(t, periode, mode) : fonction pure du temps.
   Le stéthoscope : balancement périodique autour de la patère (1,25 s, 8 par boucle) ; le tuyau est tracé point par point,
   chaque point tourné de l'angle qu'avait la patère un peu plus tôt (retard proportionnel à la distance) : le tuyau ondule,
   le pavillon (plus loin, plus lourd) traîne, les embouts aussi. Le thermomètre : horloge u sur 10 s qui part du retour de
   la situation dans la boucle ; la colonne monte de 30 % à 86 % (power3.out, puis un frémissement de 2 px), redescend
   cachée. Complète : même horloge. */
(function () {
  const REGLAGES = {
    decalage_complete: 0.0,
    patere: [212, 112], amplitude: 8, periode: 1.25, retard: 0.0012,      // retard en s par unité de longueur
    // les deux brins, depuis la patère (coordonnées au repos) : à gauche la lyre et ses deux embouts, à droite le pavillon
    // au repos : la lyre (deux branches métalliques et leurs embouts) posée sur la patère, puis le tuyau jusqu'au pavillon
    lyre: [[[212, 236], [184, 206], [174, 150], [180, 100], [192, 78]], [[212, 236], [240, 206], [250, 150], [244, 100], [232, 78]]],
    tuyau: [[212, 236], [212, 280], [202, 330], [206, 380], [230, 420], [262, 436]],
    pavillon: { r: 42, anneau: 26 },
    colonne: { bas: 18, haut: 90, montee: [0.3, 2.3], cache: 3.8 }
  };
  const R = REGLAGES, PI = Math.PI, sin = Math.sin, cos = Math.cos;
  const cl = (x, a, b) => Math.max(a, Math.min(b, x)), f2 = (v) => v.toFixed(2);
  const NS = "http://www.w3.org/2000/svg";
  const el = (p, tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const D = window.DONNEES || { situation: {} };
  const RETOUR = D.situation && D.situation.revient != null ? D.situation.revient : 8.75;
  const $ = (i) => document.getElementById(i);
  const g = $("st-steto"), P = R.patere;
  const tube = (w, c) => el(g, "path", { stroke: c, "stroke-width": w });
  const bord = tube(22, "#262019"), coeur = tube(10, "#F4F1E8");
  const lyres = R.lyre.map(() => el(g, "path", { stroke: "#262019", "stroke-width": 11 }));
  const embouts = R.lyre.map(() => el(g, "ellipse", { rx: 10, ry: 13, fill: "#262019" }));
  const noeud = el(g, "circle", { r: 13, fill: "#262019" });
  const pav = el(g, "g", {});
  el(pav, "circle", { r: R.pavillon.r, fill: "#F4F1E8", stroke: "#262019", "stroke-width": 9 });
  el(pav, "circle", { r: R.pavillon.anneau, fill: "none", stroke: "#262019", "stroke-width": 5 });
  el(pav, "rect", { x: -11, y: -58, width: 22, height: 20, rx: 4, fill: "#262019" });
  const col = $("st-colonne");
  const longueur = (pts) => { let L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return L; };
  const Lt = longueur(R.tuyau);
  function tourne(p, a) { const c = cos(a), s = sin(a), x = p[0] - P[0], y = p[1] - P[1]; return [P[0] + x * c - y * s, P[1] + x * s + y * c]; }
  const angle = (t) => R.amplitude * PI / 180 * sin(2 * PI * t / R.periode);
  // courbe lisse par les points (Catmull-Rom → Bézier)
  function lisse(Q) {
    let d = "M" + f2(Q[0][0]) + " " + f2(Q[0][1]);
    for (let i = 0; i < Q.length - 1; i++) {
      const p0 = Q[Math.max(0, i - 1)], p1 = Q[i], p2 = Q[i + 1], p3 = Q[Math.min(Q.length - 1, i + 2)];
      d += " C" + f2(p1[0] + (p2[0] - p0[0]) / 6) + " " + f2(p1[1] + (p2[1] - p0[1]) / 6) + " " + f2(p2[0] - (p3[0] - p1[0]) / 6) + " " + f2(p2[1] - (p3[1] - p1[1]) / 6) + " " + f2(p2[0]) + " " + f2(p2[1]);
    }
    return d;
  }
  window.SITUATION_ANIM = function (t, periode, mode) {
    const u = mode === "complete" ? t + R.decalage_complete : ((t - RETOUR) % 10 + 10) % 10;
    const tb = mode === "complete" ? t : t;                   // balancement : périodique sur le temps du film
    // la lyre est rigide (métal) : elle tourne d'un bloc avec la patère ; le tuyau est souple : retard croissant
    R.lyre.forEach(function (br, k) {
      const Q = br.map((p) => tourne(p, angle(tb)));
      lyres[k].setAttribute("d", lisse(Q));
      const e = Q[Q.length - 1];
      embouts[k].setAttribute("cx", f2(e[0])); embouts[k].setAttribute("cy", f2(e[1]));
    });
    const Y = tourne(R.lyre[0][0], angle(tb)); noeud.setAttribute("cx", f2(Y[0])); noeud.setAttribute("cy", f2(Y[1]));
    const Tp = R.tuyau.map((p, i) => tourne(p, angle(tb - R.retard * Lt[i])));
    const dT = lisse(Tp);
    bord.setAttribute("d", dT); coeur.setAttribute("d", dT);
    const fin = Tp[Tp.length - 1], avant = Tp[Tp.length - 2], a = Math.atan2(fin[1] - avant[1], fin[0] - avant[0]) * 180 / PI;
    const cx = fin[0] + (R.pavillon.r + 16) * cos(a * PI / 180), cy = fin[1] + (R.pavillon.r + 16) * sin(a * PI / 180);
    pav.setAttribute("transform", "translate(" + f2(cx) + " " + f2(cy) + ") rotate(" + f2(a - 90) + ")");
    // thermomètre
    const C = R.colonne;
    let niv = C.bas;
    if (u < C.cache) {
      const s = cl((u - C.montee[0]) / (C.montee[1] - C.montee[0]), 0, 1);
      niv = C.bas + (C.haut - C.bas) * (1 - Math.pow(1 - s, 3));
      if (s >= 1) niv += 0.5 * sin(2 * PI * (u - C.montee[1]) / 0.5) * Math.exp(-(u - C.montee[1]) / 0.6);
    }
    const yb = 440, yt = 104, y = yb - (yb - yt) * niv / 100;
    col.setAttribute("y", f2(y)); col.setAttribute("height", f2(yb - y + 10));
  };
})();

    </script>

      <div id="ip-retour" class="pt ip-verre"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M25.6 13.2 L16.6 22 L25.6 30.8" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div id="ip-avatar" class="pt"><svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="22.6" r="10.4" fill="#FFFFFF"/><path d="M9.2 52.5 C11.4 41.6 19.6 36.4 30 36.4 C40.4 36.4 48.6 41.6 50.8 52.5 C45.4 57.3 38.1 60 30 60 C21.9 60 14.6 57.3 9.2 52.5 Z" fill="#FFFFFF"/></svg></div>

      " c" + f(-c) + " " + f(d) + " " + f(-(b + c)) + " " + f(d) + " " + f(-(a + b + c)) + " " + f(d) + " L" + f(x + p) + " " + f(y + h) +

      // la bulle reçue (iOS 26) : coins de 20 pt, queue du coin bas gauche (relevé du showcase, lib/iphone.js)
      const f3 = (v) => +v.toFixed(3);
      const q = (u, v) => f3(bx + u * K) + " " + f3(by + bh + v * K);
      const A = (x, y) => " A" + f3(rb) + " " + f3(rb) + " 0 0 1 " + f3(x) + " " + f3(y);
      const d = "M" + f3(bx + rb) + " " + f3(by) + " H" + f3(bx + bw - rb) + A(bx + bw, by + rb) +
        " V" + f3(by + bh - rb) + A(bx + bw - rb, by + bh) + " H" + f3(bx + 24 * K) +
        " C" + q(20.5, 0) + " " + q(15, 3.6) + " " + q(9.0, 7.1) + " C" + q(8.4, 6.2) + " " + q(10.5, 4.8) + " " + q(10.5, 3.3) +
        " L" + q(10.5, -(20 - Math.sqrt(400 - Math.pow(9.5, 2)))) + A(bx, by + bh - rb) + " V" + f3(by + rb) + A(bx + rb, by) + " Z";
      $("#ip-forme-bulle").setAttribute("d", d);
      const forme = $("#ip-forme"); forme.setAttribute("width", 402 * K); forme.setAttribute("height", 874 * K);
      const gb = { x: xE + bx, y: yE + by, w: bw, h: bh };
      exiger(gb.x + gb.w <= 1080 - 70 && gb.y + gb.h + 7.1 * K <= 1040, "la bulle du SMS sort des marges");
      // entrée (le téléphone monte, posé), bulle (elle éclot de sa queue), sortie
      ft(sms, { opacity: 0, y: 320 }, { opacity: 1, y: 0, duration: 0.6, ease: P3o }, D.sms.entree);
      const mention = $("#ip-mention");
      gsap.set([bulle, mention], { opacity: 0 });
      gsap.set(forme, { scale: 0.9, opacity: 0, transformOrigin: (bx + 10 * K) + "px " + (by + bh) + "px" });
      ft(mention, { opacity: 0 }, { opacity: 1, duration: 0.3 }, D.sms.bulle - 0.1);
      ft(forme, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: P3o }, D.sms.bulle);
      ft(bulle, { opacity: 0 }, { opacity: 1, duration: 0.25 }, D.sms.bulle + 0.12);
      ft(sms, { opacity: 1, y: 0 }, { opacity: 0, y: 260, duration: 0.4, ease: "power2.in" }, D.sms.sortie);
      // le point se pose à côté de « Vokio », l'expéditeur : c'est lui qui vient d'envoyer
      const nb = { x: xE + 201 * K, y: yE + 133.4 * K }, nw = $("#ip-nom").getBoundingClientRect().width / kk;
      D.sms.repos = { x: nb.x + nw / 2 + 44, y: nb.y };
      pts.push({ t: D.sms.entree + 0.62, x: D.sms.repos.x, y: D.sms.repos.y, maintien: D.sms.sortie, prio: 3, renait: true, eteint: D.sms.entree });
    }

    // ---------------- fin : le wordmark
    const marque = $("#marque");
    gsap.set(marque, { opacity: 0 });
    if (D.fin) {
      const t0 = D.fin.entree + (D.sms && D.sms.sortie + 0.4 > D.fin.entree ? 0.4 : 0.15);   // après la sortie du téléphone
      ft(marque, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
      ft("#mot-a", { clipPath: "inset(-30% 114% -30% -14%)" }, { clipPath: "inset(-30% -14% -30% -14%)", duration: 0.6, ease: P3o }, t0);
      ft(["#mot-i", "#mot-o"], { clipPath: "inset(-30% 114% -30% -14%)" }, { clipPath: "inset(-30% -14% -30% -14%)", duration: 0.4, ease: P3o, stagger: 0.1 }, t0 + 0.3);
    }

    // ---------------- LE point : décroche, suit la voix de l'agente, travaille sur l'objet, se pose sur le ı
    const point = $("#point");
    const ecran = boite($("#tel-ecran"));   // l'écran du téléphone de la situation (qui sonne)
    const depart = { x: ecran.x + ecran.w / 2, y: ecran.y + ecran.h / 2 };
    pages.forEach(function (p) {
      if (p.qui === "agente") p.mots.forEach(function (w, q) {
        // après le mot ; en bout de ligne (bord droit à moins de 70 px du cadre), au début de la ligne suivante
        let x = w.bx + 30, y = w.by;
        if (x + R > 1080 - 70) { x = M + R; y = w.by + p.corps * 1.18; }
        pts.push({ t: Math.max(p.t_in, w.t - (q ? 0.1 : 0)), x: x, y: y, prio: 1, page: p });
      });
      else {
        const o = objetA(p.t_in) || objets.find((b) => b[3] > 0 && p.t_out > b[0] && p.t_in < b[1]);   // l'objet qui arrive pendant la page
        const rep = o && o[2] === "agenda" ? D.agenda.repos : o && o[2] === "sms" ? D.sms.repos : o && o[2] === "fiche" ? D.fiche.repos : { x: M + R, y: p.bas + 50 };
        pts.push({ t: p.t_in, x: rep.x, y: rep.y, prio: 1 });
      }
    });
    // une page de l'agente qui sort sans relève : le point rejoint l'objet à l'écran (il ne reste pas seul dans le vide)
    pages.forEach(function (p, k) {
      if (p.qui !== "agente") return;
      const n = pages[k + 1], o = objetA(p.t_out);
      if (o && (!n || n.t_in - p.t_out > 0.4)) {
        const rep = o[2] === "agenda" ? D.agenda.repos : o[2] === "sms" ? D.sms.repos : D.fiche.repos;
        if (rep) pts.push({ t: p.t_out, x: rep.x, y: rep.y, prio: 1 });
      }
    });
    pts.sort((a, b) => a.t - b.t || b.prio - a.prio);
    // les maintiens (prio ≥ 2) masquent les cibles de la voix ; à la fin d'un maintien, le point rejoint le dernier mot dit
    const cibles = [];
    let maintien = null;
    pts.forEach(function (c) {
      if (maintien && c.t < maintien.maintien && c.prio < 2) return;
      if (maintien && c.t >= maintien.maintien && c.prio < 2) maintien = null;
      if (c.prio >= 2) maintien = c;
      cibles.push(c);
    });
    // retours après maintien : vers la dernière cible de voix passée si sa page est encore là
    const finales = [];
    cibles.forEach(function (c, k) {
      finales.push(c);
      if (c.prio >= 2) {
        const n = cibles[k + 1];
        if (!n || n.t > c.maintien + 0.05) {
          const voix = pts.filter((q) => q.prio === 1 && q.t <= c.maintien && q.page && q.page.t_out > c.maintien + 0.3).pop();
          if (voix) finales.push({ t: c.maintien, x: voix.x, y: voix.y, prio: 1 });
        }
      }
    });
    gsap.set(point, { x: depart.x, y: depart.y, xPercent: -50, yPercent: -50, scale: 0 });
    ft(point, { scale: 0 }, { scale: 1, duration: 0.3, ease: P3o }, S.decroche);
    if (finales.length && finales[0].t > S.sort + 0.35) finales.unshift(Object.assign({}, finales[0], { t: S.sort + 0.3, prio: 1 }));
    let px = depart.x, py = depart.y, tp = S.decroche + 0.3, dernierePage = null;
    finales.forEach(function (c, k) {
      const t = Math.max(c.t, tp);
      if (Math.abs(c.x - px) < 0.5 && Math.abs(c.y - py) < 0.5) return;
      const n = finales[k + 1];
      const d = Math.max(0.12, Math.min(0.34, (n ? n.t - t : 0.34) * 0.85));
      const ligne = c.renait || (c.prio === 1 && c.page && c.page === dernierePage && Math.abs(c.y - py) > 20);
      if (ligne) {                // changement de ligne dans la même page : le point s'éteint et renaît, il ne traverse pas les mots
        const te = c.eteint != null ? Math.max(c.eteint, tp) : t;      // eteint : il s'éteint plus tôt (l'objet arrive dessous)
        ft(point, { scale: 1 }, { scale: 0, duration: 0.1, ease: "power2.in" }, te);
        tl.set(point, { x: c.x, y: c.y }, Math.max(te + 0.1, t - 0.001));
        ft(point, { scale: 0 }, { scale: 1, duration: 0.16, ease: P3o }, Math.max(te + 0.1, t));
        px = c.x; py = c.y; tp = Math.max(te + 0.1, t) + 0.16; dernierePage = c.page;
        return;
      }
      ft(point, { x: px, y: py }, { x: c.x, y: c.y, duration: d, ease: P3o }, t);
      px = c.x; py = c.y; tp = t + d; dernierePage = c.page || null;
    });
    if (D.fin) {
      const cible = boite($("#mot-pt"));          // mesuré avant le masque (clip-path ne change pas la boîte)
      const tv = D.fin.point - 0.55;
      ft(point, { x: px, y: py, scale: 1 }, { x: cible.x + cible.w / 2, y: cible.y + cible.h / 2, scale: cible.w / 40, duration: 0.55, ease: P3io }, tv);
      exiger(tv > tp - 0.01, "le point part vers le ı avant d'avoir fini son geste");
    } else {
      const ts = D.agenda ? D.agenda.sortie : D.fiche ? D.fiche.sortie : T - 1;
      ft(point, { scale: 1 }, { scale: 0, duration: 0.3, ease: "power2.in" }, Math.max(ts, tp));
    }

    // ---------------- contrôles internes (lus par controles_relais.py)
    exiger(Math.abs(tl.duration() - T) < 0.05 || tl.duration() <= T + 0.05, "le timeline dépasse la durée");
    pages.forEach((p, k) => exiger(isFinite(p.t_out) && p.t_out > p.t_in, "page " + k + " : fenêtre invalide"));
    window.__relais.pages = pages.map((p) => ({ qui: p.qui, t_in: +p.t_in.toFixed(3), t_out: +p.t_out.toFixed(3), top: p.top, h: Math.round(p.h),
      texte: p.mots.map((w) => w.texte).join(" ") }));
    window.__relais.cibles = finales.map((c) => ({ t: c.t, x: Math.round(c.x), y: Math.round(c.y) }));
    window.__timelines["relais"] = tl;
    window.__relais.pret = true;
  }
  Promise.all(["52px Geist", "52px 'Geist Mono'", "52px 'Instrument Serif'", "italic 52px 'Instrument Serif'", "52px Inter"]
    .map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(construire);
})();
</script>
