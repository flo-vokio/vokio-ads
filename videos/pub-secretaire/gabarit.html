    {
      const K = 2.45, K0 = 2.124378;

      const NS = "http://www.w3.org/2000/svg", f = K / K0;
      [[0, "#8E8A83"], [1.5, "#C9C5BE"], [3, "url(#ip-titane)"], [5.5, "#BDB9B1"], [8.5, "#6A6862"], [10, "#242424"], [12.5, "#050505"]].forEach(function (c) {
        const e = document.createElementNS(NS, "path"), o = c[0] * f;
        e.setAttribute("d", arrondi(o, o, Wt - 2 * o, Ht - 2 * o, RT - o, XI)); e.setAttribute("fill", c[1]); $("#ip-couches").appendChild(e);
      });
      [[-6, 0.205, 0.2497], [-6, 0.285, 0.359], [-6, 0.380, 0.453], [Wt / f - 4, 0.311, 0.429]].forEach(function (b) {
        const r = document.createElementNS(NS, "rect");

      const f3 = (v) => +v.toFixed(3), q = (u, v) => f3(bx + u * K) + " " + f3(by + bh + v * K);

      const d = "M" + f3(bx + rb) + " " + f3(by) + " H" + f3(bx + bw - rb) + A(bx + bw, by + rb) +

      $("#ip-forme-bulle").setAttribute("d", d);

      exiger(yE + by + bh + 7.1 * K <= 1250, "la bulle du SMS descend sous 1250 (" + Math.round(yE + by + bh) + ")");
      window.__pub.bulle_bas = Math.round(yE + by + bh);
      ft(sms, { autoAlpha: 0, y: 360 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: P3o }, ip.entree);

      const nb = { x: xE + 201 * K, y: yE + 133.4 * K }, nw = $("#ip-nom").getBoundingClientRect().width / kk;
      ip.repos = { x: nb.x + nw / 2 + 46, y: nb.y };
    }

    // ---------------- la révélation, puis la fin
    const t2 = $("#titre2"), s2 = $("#sous2");
    const fin2 = TT.plume - 0.58;          // les titres sont partis quand le point descend (il ne traverse pas le texte)
    montrer(t2, TT.titre_ia, fin2 + 0.3); montrer(s2, TT.titre_ia_2, fin2 + 0.3);

    ft([t2, s2], { autoAlpha: 1, y: 0 }, { autoAlpha: 0, y: -30, duration: 0.26, ease: "power2.in" }, fin2);
    // le mot s'écrit derrière le point, comme de l'encre (film long, s7) : masque opaque jusqu'à xp − 40, transparent dès xp

      onUpdate: () => encre(stylo.x0 + (stylo.x1 + L_ENCRE - stylo.x0) * EASE_PLUME(plume.u)) }, TT.plume);
    tl.call(() => { mot.style.webkitMaskImage = "none"; mot.style.maskImage = "none"; }, null, TT.plume_fin + 0.001);
    tl.call(() => encre(stylo.x1 + L_ENCRE), null, TT.plume_fin - 0.001);
    const cta = $("#cta"), offre = $("#offre");

    ft(offre, { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: P3o }, TT.cta_2);
    exiger(boite(offre).y + boite(offre).h <= 1250, "l'offre descend sous 1250");

    // ---------------- LE point : il est le point final de l'accroche, puis suit la voix de l'agente
    const point = $("#point");
    const pt1 = boite($("#t1-pt")), pt2 = boite($("#t2-pt")), ptI = boite($("#mot-pt"));
    pages.forEach(function (p) {

        // l'appelant parle : le point écoute, posé à gauche au-dessus de la page

        pts.push({ t: p.t_in, x: rep.x, y: rep.y, prio: 1 });

      ft(point, { scale: s1 }, { scale: s1 * 1.45, duration: 0.09, ease: "power2.out" }, w.t);
