<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><title>s3-ecoute</title></head>
<body>
<!--
  Sous-composition s3-ecoute · film 10.40 → 17.30 s (durée 6.9 s, images 312 à 518), hôte #h-s3-ecoute.
  Bible, scène « s3-ecoute » : le point écoute. Trois éléments, jamais plus :
    1. la parole de l'appelant (Instrument Serif Italic 88/97, x 90, lignes de base 600 / 697 / 794) :
       C1 « mon chat, euh, Moka, / euh, mange plus / depuis hier. », groupe par groupe à l'attaque mesurée
       (les deux « euh, » en gris), puis C2 « Demain, vous avez / des disponibilités ? », ligne par ligne ;
    2. le point : #point de la RACINE, solaire, immobile en (974 ; 1000), il ne respire pas (jamais dessiné ici) ;
    3. la mention « Appel réel, raccourci. » (Geist 36, gris, x 90, ligne de base 1440), non dite.
  Le tamis : dans le silence numérique de la coupe entre C1 et C2, les deux « euh, » s'effacent sur place ;
  les autres mots ne bougent pas d'un pixel. Le « Euh, » qui ouvre C2 n'est jamais écrit : on l'entend
  pendant que le texte filtré reste à l'écran.
  Aucun temps de voix en dur : attaques = DONNEES.mots via TEXTE (pages DONNEES.pages de la scène),
  coupes = DONNEES.dialogue.extraits, départ du point = DONNEES.point.position.
  Temps de la timeline : LOCAUX (0 = 10,40 s film), convertis par TEXTE.scene("s3-ecoute").
  N'utilise pas POINT (le point est immobile pendant toute la scène) : la scène se monte aussi dans
  outils/banc.html, qui ne charge pas lib/point.js.
-->
<template id="s3-ecoute-template">
<style>
@font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:block;src:url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2")}
#root{position:absolute;inset:0;overflow:hidden;color:#262019;font-family:"Geist",sans-serif}
/* La parole de l'appelant. Instrument Serif Italic 400, 88 px, interlignage 97 px (bible : lignes de base
   600 / 697 / 794). Dans Chromium : ascendante 87 px, descendante 27 px (hhea 990 / 310 arrondis au pixel),
   demi-interlignage −8,5 px, ligne de base à 78 px sous le haut de la ligne (MESURÉ dans le
   chrome-headless-shell de HyperFrames : voir le commentaire de #s3-parole). top 522 → 600 / 697 / 794.
   Les deux pages occupent la même place, une seule à la fois. */
#s3-parole{position:absolute;left:90px;top:522px;width:920px;height:291px}
.s3-page{position:absolute;left:0;top:0;margin:0;font-family:"Instrument Serif",serif;font-weight:400;font-style:italic;
         font-size:88px;line-height:97px;letter-spacing:0;color:#262019;white-space:nowrap}
/* Les hésitations : gris texte de la DA (#6F695F, 4,8:1 sur le papier : AA). */
.s3-page .s3-euh{color:#6F695F}
/* La mention, non dite. Geist 400 36 px, interlignage 48 px, gris : ligne de base 1440 (top mesuré). */
#s3-mention{position:absolute;left:90px;top:1404px;margin:0;font-family:"Geist",sans-serif;font-weight:400;font-style:normal;
            font-size:36px;line-height:48px;letter-spacing:0;color:#6F695F;white-space:nowrap}
</style>
<div id="root" data-composition-id="s3-ecoute" data-width="1080" data-height="1920">
  <div id="s3-parole" data-element="parole">
    <p id="s3-c1" class="s3-page"></p>
    <p id="s3-c2" class="s3-page"></p>
  </div>
  <p id="s3-mention" data-element="mention"></p>
</div>
<script>
(function () {
  const D = window.DONNEES;
  const FPS = D.fps;
  const UNE = 1 / FPS;
  const sc = TEXTE.scene("s3-ecoute");
  const tl = gsap.timeline({ paused: true });
  const r6 = function (v) { return +v.toFixed(6); };
  const derniereImage = r6((Math.round(sc.fin * FPS) - 1) / FPS);          // 17,2667 s : image 518
  function exiger(ok, msg) { if (!ok) throw new Error("s3-ecoute : " + msg); }
  function extrait(id) {
    const e = D.dialogue.extraits.find(function (x) { return x.id === id; });
    exiger(e, "extrait " + id + " absent de DONNEES.dialogue");
    return e;
  }

  // Le départ du point vers s4 : la dernière clé de la scène après laquelle il quitte sa place (17,20).
  const cles = D.point.position;
  let tDepart = null;
  for (let i = 0; i < cles.length - 1; i++) {
    const a = cles[i], b = cles[i + 1];
    if (a.t >= sc.debut && a.t < sc.fin && (a.x !== b.x || a.y !== b.y)) tDepart = a.t;
  }
  exiger(tDepart != null, "départ du point introuvable dans DONNEES.point.position");

  // ── 1. Les pages de la bible pour cette scène, telles que DONNEES.pages les donne ──
  const pages = D.pages.filter(function (p) { return p.scene === sc.id; });
  exiger(pages.length === 2, "2 pages attendues dans DONNEES.pages, " + pages.length + " trouvées");
  const [pC1, pC2] = pages;
  exiger(pC1.extrait === "C1" && pC2.extrait === "C2", "pages C1 puis C2 attendues");
  // interlignage 97/88 = 1,10 em < 1,3 : les boîtes de police se chevauchent d'une ligne à l'autre (pas l'encre)
  const c1 = TEXTE.poser("#s3-c1", pC1.lignes, { extrait: pC1.extrait, depuis: pC1.depuis, chevauchement: true });
  const c2 = TEXTE.poser("#s3-c2", pC2.lignes, { extrait: pC2.extrait, depuis: pC2.depuis, chevauchement: true });
  const euhs = c1.mots.filter(function (u) { return u.mot && u.mot.cle === "euh"; });
  exiger(euhs.length === 2, "2 « euh » attendus dans C1, " + euhs.length + " trouvés");
  euhs.forEach(function (u) { u.el.classList.add("s3-euh"); });

  // Calage sur la voix : un mot qui démarre à l'image de son attaque n'y est encore qu'à l'opacité 0 et
  // n'apparaît qu'à l'image suivante, 33 à 40 ms APRÈS le son (au seuil où l'on perçoit le retard de
  // l'image). Il démarre donc une image plus tôt : sa première image visible (38 %, 10 px sous sa
  // place) est l'image qui contient l'attaque mesurée. Écart au mots.json : −1 image (tolérance ±1).
  const AVANCE = -UNE;
  // C1 : chaque groupe monte de 16 px à l'attaque mesurée de son premier mot, 0,30 s power3.out.
  TEXTE.reveler(tl, c1, { scene: sc.id, duree: 0.30, dy: 16, ease: "power3.out", decalage: AVANCE });

  // ── 2. La mention, dans le silence visuel du bas : fondu seul, sans déplacement ──
  // 0,04 s après l'attaque du premier mot (bible : 10,60 pour « mon chat, » à 10,56) : l'œil lit la
  // parole d'abord, la mention se pose dessous sans lui disputer l'instant.
  const mention = TEXTE.poser("#s3-mention", ["Appel réel, raccourci."], { extrait: null });
  const elMention = mention.conteneur;
  const tMention = TEXTE.aImage(c1.mots[0].t + 0.04);
  tl.fromTo(elMention, { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power3.out", immediateRender: true },
            sc.local(tMention));

  // ── 3. Le tamis : dans le silence numérique de la coupe C1 → C2 ──
  // Il part à l'image où C1 se tait (fin de l'extrait, 14,06 → image 422) et doit finir avant que C2 ne
  // reprenne (14,60) : les « euh, » s'effacent dans le silence, sur place (opacité seule, 0,45 s
  // power2.out, une image d'écart). Les autres mots ne bougent pas d'un pixel.
  const eC1 = extrait("C1"), eC2 = extrait("C2");
  const tTamis = TEXTE.aImage(eC1.film_out);
  const DUREE_TAMIS = 0.45;
  exiger(tTamis + UNE * (euhs.length - 1) + DUREE_TAMIS <= eC2.film_in + 1e-6,
         "le tamis déborde sur la reprise de C2 (" + eC2.film_in + " s)");
  exiger(tTamis >= TEXTE.aImage(c1.mots[c1.mots.length - 1].t + AVANCE) + 0.30 - 1e-6,
         "le tamis part avant que le dernier mot de C1 soit posé");
  euhs.forEach(function (u, i) {
    tl.fromTo(u.el, { opacity: 1 }, { opacity: 0, duration: DUREE_TAMIS, ease: "power2.out", immediateRender: false },
              sc.local(r6(tTamis + i * UNE)));
  });

  // ── 4. C1 sort, C2 entre ──
  // C2 : chaque ligne monte d'un bloc (16 px, 0,35 s power3.out) à l'attaque de son premier mot dit :
  // « Demain, » puis « des ». La question est fluide, elle s'écrit par lignes, pas par hésitations.
  const lignesC2 = c2.lignes.map(function (ligne, il) {
    const unites = c2.mots.filter(function (u) { return u.ligne === il; });
    return { els: unites.map(function (u) { return u.el; }), t: TEXTE.aImage(unites[0].t + AVANCE) };
  });
  // Le texte filtré reste pendant le « Euh, » de C2 (entendu, jamais écrit), puis sort par ses masques,
  // vers le bas, 0,20 s power3.in. La sortie finit à l'image où « Demain, » démarre : à cette image-là,
  // C1 est sous son masque et « Demain, » encore à l'opacité 0. Une seule image vide entre les deux.
  const tDemain = lignesC2[0].t;
  const SORTIE = 0.20;
  const finC1 = r6(tDemain);
  const debutC1 = r6(finC1 - SORTIE);
  exiger(debutC1 >= tTamis + UNE * (euhs.length - 1) + DUREE_TAMIS - 1e-6, "C1 sort avant la fin du tamis");
  TEXTE.sortir(tl, c1, sc.local(debutC1), { duree: SORTIE, ease: "power3.in" });
  // une fois sortis (invisibles sous le masque), les mots s'effacent : aucun texte fantôme au contrôle
  tl.set(c1.mots.map(function (u) { return u.el; }), { opacity: 0 }, sc.local(finC1));

  lignesC2.forEach(function (L) {
    tl.fromTo(L.els, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: true },
              sc.local(L.t));
  });

  // ── 5. Tout sort quand la ligne se tait : la page est vide quand le point part ──
  // C2 sort par ses masques dès que l'extrait se tait (17,00 : silence numérique) ; la mention s'éteint
  // en même temps. Les deux ont fini à l'instant où le point quitte (974 ; 1000) (17,20) : il part seul.
  const debutC2 = TEXTE.aImage(eC2.film_out);
  const finC2 = r6(debutC2 + SORTIE);
  exiger(debutC2 >= lignesC2[lignesC2.length - 1].t + 0.35 - 1e-6, "C2 sort avant que sa dernière ligne soit posée");
  exiger(finC2 <= tDepart + 1e-6, "C2 sort encore quand le point part (" + finC2 + " > " + tDepart + ")");
  exiger(finC2 <= derniereImage + 1e-6, "C2 sort après la dernière image de la scène");
  TEXTE.sortir(tl, c2, sc.local(debutC2), { duree: SORTIE, ease: "power3.in" });
  tl.set(c2.mots.map(function (u) { return u.el; }), { opacity: 0 }, sc.local(finC2));
  tl.fromTo(elMention, { opacity: 1 }, { opacity: 0, duration: SORTIE, ease: "power3.in", immediateRender: false },
            sc.local(debutC2));

  window.__timelines["s3-ecoute"] = tl;
})();
</script>
</template>
</body>
</html>
