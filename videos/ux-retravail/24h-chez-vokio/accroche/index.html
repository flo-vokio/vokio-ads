<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Accroche de 1,6 s collée devant 24h-chez-vokio-9x16-voix.mp4 (20/10/2026).
     « Votre téléphone sonne. » est écrit ; la voix du doubleur enchaîne « Une cliente appelle et vous avez
     les mains prises » : une seule phrase lue puis entendue, sans redoublage. Rendu image par image par
     fabriquer.py via window.poser(t) ; le texte vibre pendant chaque sonnerie. -->
<style>
@font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("../assets/fonts/Geist-Regular.woff2") format("woff2");}
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:normal;font-display:block;src:url("../assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");}
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:block;src:url("../assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F1E8}
#root{position:relative;width:100%;height:100%;background:#F4F1E8;color:#262019;
      font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-kerning:normal}
#acc{position:absolute;left:70px;right:60px;top:430px;font-family:"Instrument Serif",Georgia,serif;
     font-size:230px;line-height:.98;letter-spacing:-.025em;will-change:transform}
#acc em{font-style:italic}
#mention{position:absolute;left:0;right:0;top:1456px;text-align:center;font-size:36px;line-height:1;color:#6F695F}
</style>
</head>
<body>
<div id="root">
  <p id="acc">Votre<br>téléphone<br><em>sonne.</em></p>
  <p id="mention">Établissements fictifs · captures réelles de app.vokio.fr</p>
</div>
<script>
// Sonneries : mêmes bornes que la piste son de fabriquer.py.
const SONNERIES = [[0.0, 0.62], [0.82, 1.6]];
window.poser = (t) => {
  const s = SONNERIES.find(([a, b]) => t >= a && t < b);
  let x = 0, r = 0;
  if (s) {
    // vibration de téléphone posé sur une table : petit aller-retour rapide (≈ 22 Hz), amorti en fin de sonnerie
    const u = t - s[0], fin = Math.min(1, (s[1] - t) / 0.12);
    x = 7 * Math.sin(2 * Math.PI * 22 * u) * fin;
    r = 0.35 * Math.sin(2 * Math.PI * 22 * u + 1.3) * fin;
  }
  document.getElementById("acc").style.transform = `translateX(${x.toFixed(2)}px) rotate(${r.toFixed(3)}deg)`;
};
window.poser(0);
</script>
</body>
</html>
