<!doctype html>
<html lang="fr" data-composition-variables='[
  {"id":"metier","type":"string","label":"Dossier des captures (assets/<metier>/)","default":"plombier"},
  {"id":"heure","type":"string","label":"Heure de l’ouverture","default":"23<em>:</em>07"},
  {"id":"accroche","type":"string","label":"Accroche","default":"Un client appelle. <em>Vous dormez.</em>"},
  {"id":"etat","type":"string","label":"État de la ligne","default":"Camille répond à votre place"},
  {"id":"t1","type":"string","label":"Titre 1, la liste","default":"Pendant ce temps, <em>votre espace se remplit.</em>"},
  {"id":"t2","type":"string","label":"Titre 2, le résumé","default":"Le résumé de l’appel <em>s’écrit tout seul.</em>"},
  {"id":"t3","type":"string","label":"Titre 3, l’agenda","default":"Et le rendez-vous <em>est déjà posé.</em>"},
  {"id":"t4","type":"string","label":"Titre 4, l’impact","default":"Au matin, <em>vous n’avez rien raté.</em>"},
  {"id":"arg1","type":"string","label":"Argument 1","default":"Répond à chaque appel, jour et nuit"},
  {"id":"arg2","type":"string","label":"Argument 2","default":"Prend les rendez-vous dans votre agenda"},
  {"id":"arg3","type":"string","label":"Argument 3","default":"Note tout à votre place"},
  {"id":"pan0","type":"number","label":"Agenda, départ du panoramique (px)","default":-360},
  {"id":"pan1","type":"number","label":"Agenda, arrivée du panoramique (px)","default":-700},
  {"id":"agendaH","type":"number","label":"Agenda, hauteur de la fenêtre d’origine (px)","default":1160},
  {"id":"hRang","type":"number","label":"Hauteur d’une rangée d’appel (px)","default":246},
  {"id":"hAppel","type":"number","label":"Hauteur de l’appel replié (px)","default":243},
  {"id":"hOuvert","type":"number","label":"Hauteur de l’appel déplié (px)","default":926},
  {"id":"hImpact","type":"number","label":"Hauteur carte impact (px)","default":471},
  {"id":"hNuit","type":"number","label":"Hauteur carte hors horaires (px)","default":460}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>film-demo · démo de l’application, un profil par métier</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
  @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2");}
  @font-face{font-family:"Instrument Serif";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");}
  @font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:block;src:url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");}

  :root{
    --noir:#262019; --noir-2:#2F281F; --ivoire:#F4F1E8; --papier:#F4F1E8; --papier-3:#FBF9F2;
    --soleil:#EFA424; --pierre:#8A857C; --pierre-nuit:#A39D92;
    --serif:"Instrument Serif",serif; --sans:"Geist",sans-serif; --mono:"Geist Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--noir)}
  body{color:var(--ivoire);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #root{position:relative;width:100%;height:100%;overflow:hidden;background:var(--noir)}

  /* une seule profondeur : une lueur chaude, très basse, jamais le soleil */
  #lueur{position:absolute;left:-260px;top:260px;width:1600px;height:1400px;border-radius:50%;
         background:radial-gradient(closest-side, rgba(244,241,232,.075), rgba(244,241,232,.03) 55%, rgba(244,241,232,0));}

  .scene{position:absolute;inset:0;width:100%;height:100%}

  /* un masque = une ligne de texte qui monte de sous sa ligne de base */
  .masque{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .16em;margin:0 -.04em -.16em}
  .masque > span{display:inline-block}

  /* ── Ouverture ── */
  #heure{position:absolute;left:84px;top:520px;font-family:var(--serif);font-size:230px;line-height:.92;letter-spacing:-.03em}
  #heure .c{display:inline-block}
  #heure em{font-style:normal;color:var(--pierre-nuit)}
  #accroche{position:absolute;left:90px;right:90px;top:790px;font-family:var(--serif);font-size:92px;line-height:1.08;letter-spacing:-.015em}
  #accroche em{font-style:italic;color:var(--pierre-nuit)}
  #etat{position:absolute;left:90px;top:1110px;display:flex;align-items:center;font-family:var(--mono);font-size:36px;
        text-transform:uppercase;letter-spacing:.08em;color:var(--ivoire)}
  #etat .point{position:relative;flex:none;width:20px;height:20px;margin-right:24px}
  #etat .point i{position:absolute;inset:0;border-radius:50%;background:var(--soleil)}
  #etat .point b{position:absolute;inset:0;border-radius:50%;border:2px solid var(--soleil);opacity:0}

  /* ── Titres ── */
  .titre{position:absolute;left:90px;right:90px;top:236px;font-family:var(--serif);font-size:86px;
         line-height:1.06;letter-spacing:-.014em}
  .titre em{font-style:italic;color:var(--ivoire)}
  .titre.agit em{color:var(--soleil)}
  .titre .masque{display:block}

  /* ── Les plans : des morceaux de l'app réelle, bord à filet, sans ombre ── */
  .plan{position:absolute;left:90px;width:900px;border-radius:40px;overflow:hidden;
        box-shadow:0 0 0 1px rgba(244,241,232,.14)}
  .plan img{display:block;width:900px;height:auto}
  #liste{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #rangs{position:absolute;left:90px;top:470px;width:900px}
  #rangs .plan{position:relative;left:0;margin-bottom:16px;border-radius:30px}
  #carte{position:absolute;left:90px;top:470px;width:900px}
  #carte .plan{left:0;top:0}
  #ouvert{clip-path:inset(0 0 0 0 round 40px)}
  #agenda{top:470px}
  #agenda img{position:absolute;left:0;top:0;width:1170px}
  #impact, #nuit{top:540px}

  /* ── La fin, en clair ── */
  #clair{position:absolute;inset:0;background:var(--papier-3);color:var(--noir)}
  #clair .dedans{position:absolute;left:90px;right:90px;top:430px;text-align:center}
  #mot .masque{padding-top:.2em;margin-top:-.2em}
  #mot-in{display:inline-flex;align-items:baseline}
  .vk-word{font-family:var(--serif);font-weight:400;font-size:210px;letter-spacing:-.045em;line-height:.9;
           display:inline-flex;align-items:baseline;color:var(--noir)}
  .vk-word .i{position:relative;font-style:normal}
  .vk-word .dot{position:absolute;left:63.5%;margin-left:-.055em;top:.13em;width:.11em;height:.11em;border-radius:50%;background:var(--soleil)}
  #fente{position:relative;height:130px;margin-top:70px}
  #fente p{position:absolute;left:0;right:0;top:0}
  .arg{font-family:var(--sans);font-size:46px;line-height:1.25;color:#2F281F}
  #prix{font-family:var(--serif);font-size:76px;line-height:1.1;color:var(--noir)}
  #prix em{font-style:italic}
  #cta{margin-top:56px;padding-top:44px;border-top:1px solid rgba(38,32,25,.22);font-family:var(--serif);font-size:64px;line-height:1.1;color:var(--noir);text-wrap:balance}
  #cta em{font-style:italic}

  #mention{position:absolute;left:60px;right:60px;top:1428px;text-align:center;font-size:36px;line-height:1.1;color:#B5AFA4}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="38.2" data-fps="30" data-width="1080" data-height="1920">
  <div id="lueur"></div>

  <!-- 1 · l'ouverture : l'heure, l'accroche, l'agent qui répond -->
  <section id="s-ouverture" class="scene clip" data-start="0" data-duration="5.3" data-track-index="0">
    <p id="heure"></p>
    <p id="accroche"></p>
    <div id="etat"><span class="point"><b></b><i></i></span><span class="masque"><span id="etat-texte"></span></span></div>
  </section>

  <!-- 2 · l'appel arrive dans la liste, puis se déplie -->
  <section id="s-appel" class="scene clip" data-start="5" data-duration="12.5" data-track-index="1">
    <div id="liste">
      <div id="rangs">
        <div class="plan" id="r2"><img id="img-r2" src="assets/plombier/appel-2.png" alt=""></div>
        <div class="plan" id="r3"><img id="img-r3" src="assets/plombier/appel-3.png" alt=""></div>
      </div>
      <div id="carte">
        <div class="plan" id="replie"><img id="img-replie" src="assets/plombier/appel-1.png" alt=""></div>
        <div class="plan" id="ouvert"><img id="img-ouvert" src="assets/plombier/appel-1-ouvert.png" alt=""></div>
      </div>
    </div>
    <p class="titre agit" id="t1"></p>
    <p class="titre" id="t2"></p>
  </section>

  <!-- 3 · l'agenda -->
  <section id="s-agenda" class="scene clip" data-start="17.4" data-duration="6.1" data-track-index="2">
    <div class="plan" id="agenda"><img id="img-agenda" src="assets/plombier/agenda-jour.png" alt=""></div>
    <p class="titre" id="t3"></p>
  </section>

  <!-- 4 · l'impact, une carte à la fois -->
  <section id="s-impact" class="scene clip" data-start="23.4" data-duration="6.3" data-track-index="3">
    <div class="plan" id="impact"><img id="img-impact" src="assets/plombier/impact-rdv.png" alt=""></div>
    <div class="plan" id="nuit"><img id="img-nuit" src="assets/plombier/impact-nuit.png" alt=""></div>
    <p class="titre agit" id="t4"></p>
  </section>

  <!-- 5 · la fin, en clair -->
  <section id="s-fin" class="scene clip" data-start="29.5" data-duration="8.7" data-track-index="4">
    <div id="clair">
      <div class="dedans">
        <p class="vk-word" id="mot"><span class="masque"><span id="mot-in">Vok<span class="i">ı<span class="dot" id="point-i"></span></span>o</span></span></p>
        <div id="fente">
          <p class="arg" id="a1"></p>
          <p class="arg" id="a2"></p>
          <p class="arg" id="a3"></p>
          <p id="prix">59 € par mois, <em>sans engagement.</em></p>
        </div>
        <p id="cta">Entendez-le vous-même <em>sur vokio.fr</em></p>
      </div>
    </div>
  </section>

  <p id="mention">Établissement fictif, captures réelles de app.vokio.fr</p>
</div>

<script>
(function(){
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const D = {metier:"plombier", pan0:-360, pan1:-700, agendaH:1160, hRang:246, hAppel:243, hOuvert:926, hImpact:471, hNuit:460};
  const v = k => (V[k] !== undefined && V[k] !== "" ? V[k] : D[k]);
  const $ = s => document.querySelector(s);

  // ── les captures du métier ──
  const dossier = "assets/" + v("metier") + "/";
  const src = {"img-r2":"appel-2","img-r3":"appel-3","img-replie":"appel-1","img-ouvert":"appel-1-ouvert",
               "img-agenda":"agenda-jour","img-impact":"impact-rdv","img-nuit":"impact-nuit"};
  for (const id in src) document.getElementById(id).src = dossier + src[id] + ".png";

  // ── les textes, mot pour mot ; chaque partie a son masque ──
  // « X, <em>Y</em> » devient deux lignes-masques : la phrase, puis sa chute.
  function enMasques(el, html){
    const m = html.match(/^(.*?)\s*<em>(.*)<\/em>\s*$/);
    const parts = m ? [m[1], "<em>" + m[2] + "</em>"] : [html];
    el.innerHTML = parts.map(p => '<span class="masque"><span>' + p + '</span></span>').join(" ");
    return Array.from(el.querySelectorAll(".masque > span"));
  }
  // l'heure, un caractère à la fois
  const heure = $("#heure");
  heure.innerHTML = v("heure").replace(/<em>(.*?)<\/em>|(.)/g, (all, em, c) =>
    '<span class="masque"><span class="c">' + (em !== undefined ? "<em>" + em + "</em>" : c) + '</span></span>');
  const chiffres = Array.from(heure.querySelectorAll(".c"));
  const acc = enMasques($("#accroche"), v("accroche"));
  $("#etat-texte").textContent = v("etat");
  const T1 = enMasques($("#t1"), v("t1")), T2 = enMasques($("#t2"), v("t2")),
        T3 = enMasques($("#t3"), v("t3")), T4 = enMasques($("#t4"), v("t4"));
  $("#a1").textContent = v("arg1"); $("#a2").textContent = v("arg2"); $("#a3").textContent = v("arg3");

  // ── la géométrie, calculée une fois ──
  const hRang = +v("hRang"), hAppel = +v("hAppel"), hOuvert = +v("hOuvert");
  const PAS = 16;                                        // l'écart entre deux rangées
  const decale = hAppel + PAS;                           // ce que la liste descend quand l'appel entre
  const ZOOM = 1.3;                                      // l'agenda, agrandi pour que ses horaires se lisent
  const hAgenda = Math.min(+v("agendaH"), 880);
  $("#agenda").style.height = hAgenda + "px";
  $("#ouvert").style.height = hOuvert + "px";

  const tl = gsap.timeline({paused:true});
  const E = "power3.out", S = "power3.in", M = "power3.inOut";

  // montée d'une ligne de sous son masque
  const monte = (els, t, d, st) => tl.fromTo(els, {yPercent:140}, {yPercent:0, duration:d||0.9, ease:E, stagger:st||0.22}, t);
  const part  = (els, t, d)     => tl.to(els, {yPercent:-140, duration:d||0.45, ease:S, stagger:0.06}, t);

  // ── 1 · ouverture ─────────────────────────────────────────────
  monte(chiffres, 0.2, 1.0, 0.07);
  monte(acc, 1.0, 0.9, 0.45);
  // l'agent agit : le point solaire s'allume, son onde respire deux fois
  tl.fromTo("#etat .point i", {scale:0}, {scale:1, duration:0.5, ease:E}, 3.2);
  tl.fromTo("#etat .point b", {scale:1, opacity:0.7}, {scale:2.6, opacity:0, duration:1.1, ease:"power2.out", repeat:1, repeatDelay:0.25, immediateRender:false}, 3.3);
  tl.fromTo("#etat-texte", {yPercent:140}, {yPercent:0, duration:0.9, ease:E}, 3.3);
  // sortie : tout monte et s'efface, plus vite que l'entrée
  part(chiffres, 4.35, 0.5);
  part(acc, 4.45, 0.5);
  tl.to("#etat", {y:-40, opacity:0, duration:0.45, ease:S}, 4.55);

  // ── 2 · la liste, puis l'appel qui arrive en tête ────────────
  gsap.set("#ouvert", {opacity:0});
  tl.fromTo("#rangs", {y:90, opacity:0}, {y:0, opacity:0.62, duration:0.7, ease:E}, 5.1);
  // l'appel entre en tête : la liste descend d'une rangée, la carte descend du haut
  tl.to("#rangs", {y:decale, duration:0.7, ease:M}, 5.8);
  tl.fromTo("#carte", {y:-60, opacity:0}, {y:0, opacity:1, duration:0.85, ease:E}, 5.95);
  monte(T1, 6.4, 0.9, 0.3);
  // le repli se déplie : la liste s'écarte, la carte s'ouvre vers le bas
  part(T1, 10.45, 0.45);
  tl.to("#rangs", {y:decale + 160, opacity:0, duration:0.55, ease:S}, 10.5);
  tl.to("#ouvert", {opacity:1, duration:0.12, ease:"none"}, 11.1);
  tl.fromTo("#ouvert", {clipPath:"inset(0px 0px " + (hOuvert - hAppel) + "px 0px round 40px)"},
                       {clipPath:"inset(0px 0px 0px 0px round 40px)", duration:1.0, ease:M}, 11.1);
  tl.to("#replie", {opacity:0, duration:0.12, ease:"none"}, 11.16);
  monte(T2, 11.6, 0.9, 0.3);
  // le temps de lire : un rapprochement très lent, sur l'image seulement
  tl.fromTo("#img-ouvert", {scale:1}, {scale:1.03, transformOrigin:"50% 30%", duration:5.2, ease:"sine.inOut"}, 11.7);
  part(T2, 16.95, 0.45);
  tl.to("#carte", {y:-120, opacity:0, duration:0.55, ease:S}, 17.0);

  // ── 3 · l'agenda ──────────────────────────────────────────────
  tl.fromTo("#agenda", {y:110, opacity:0}, {y:0, opacity:1, duration:0.9, ease:E}, 17.6);
  monte(T3, 18.0, 0.9, 0.3);
  tl.fromTo("#img-agenda", {y:+v("pan0") * ZOOM}, {y:+v("pan1") * ZOOM, duration:4.4, ease:M}, 18.3);
  part(T3, 22.95, 0.45);
  tl.to("#agenda", {y:-120, opacity:0, duration:0.55, ease:S}, 23.0);

  // ── 4 · l'impact : une carte, puis l'autre ───────────────────
  tl.fromTo("#impact", {y:110, opacity:0}, {y:0, opacity:1, duration:0.9, ease:E}, 23.6);
  monte(T4, 24.0, 0.9, 0.3);
  tl.to("#impact", {y:-90, opacity:0, duration:0.5, ease:S}, 26.3);
  tl.fromTo("#nuit", {y:110, opacity:0}, {y:0, opacity:1, duration:0.9, ease:E}, 26.6);
  part(T4, 29.0, 0.45);
  tl.to("#nuit", {y:-90, opacity:0, duration:0.45, ease:S}, 29.05);

  // ── 5 · la fin, en clair : le jour se lève par le bas ────────
  tl.fromTo("#clair", {clipPath:"inset(100% 0% 0% 0%)"}, {clipPath:"inset(0% 0% 0% 0%)", duration:0.9, ease:M}, 29.55);
  tl.to("#mention", {color:"#6E685F", duration:0.3}, 29.9);
  monte("#mot-in", 30.1, 1.0);
  tl.fromTo("#point-i", {scale:0}, {scale:1, duration:0.45, ease:E}, 30.75);
  // les arguments, un seul à la fois dans la même fente
  [["#a1", 31.0], ["#a2", 32.25], ["#a3", 33.5]].forEach(([id, t]) => {
    tl.fromTo(id, {y:40, opacity:0}, {y:0, opacity:1, duration:0.55, ease:E}, t);
    tl.to(id, {y:-30, opacity:0, duration:0.3, ease:S}, t + 1.0);
  });
  tl.fromTo("#prix", {y:40, opacity:0}, {y:0, opacity:1, duration:0.7, ease:E}, 34.75);
  tl.fromTo("#cta", {y:30, opacity:0}, {y:0, opacity:1, duration:0.7, ease:E}, 35.5);

  // états de départ des éléments de la fin
  gsap.set(["#a1","#a2","#a3","#prix","#cta"], {opacity:0});

  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
