<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      @font-face { font-family: 'Instrument Serif'; src: url('assets/fonts/InstrumentSerif-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: block; }
      @font-face { font-family: 'Instrument Serif'; src: url('assets/fonts/InstrumentSerif-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: 'Geist'; src: url('assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
      :root {
      --paper: #F4F1E8;
      --paper-deep: #F9DBA7;
      --sun: #EFA424;
      --sun-soft: #F8D69B;
      --haze: #F5C677;
      --ink: #262019;
      --ember: #E5701F;
      --cap-ink: #262019;
      --cap-canvas: #F4F1E8;
      --cap-accent: #EFA424;
      --cap-accent-2: #E5701F;
      --font-display: "Instrument Serif", system-ui, serif;
      --font-body: "Geist", system-ui, sans-serif;
      --cap-band-top: 1310px;
      --cap-band-height: 190px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE parchment card — single 1px hairline ink border (biennale's only border),
     square corners, NO shadow */
  .caption-pill {
    max-width: 88%;
    padding: 8px 0 12px;
    background: transparent;
    border: 0;
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: var(--font-sans, "Geist"), "Geist", system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.01em;
  }

  /* upcoming — faint indigo ink, no underprint */
  .caption-word {
    display: inline-block;
    padding: 0 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #1b2566) 42%, var(--cap-canvas, #e9e5db));
  }
  /* current word — THE solar-yellow underprint (box-shadow spread = a hard square
     block w/o layout shift; no blur), indigo ink reading on top */
  .caption-word.is-active {
    color: var(--cap-ink, #1b2566);
    background: transparent;
    box-shadow: 0 0.08em 0 0 var(--cap-accent, #f1ee2e);
  }
  /* already spoken — solid indigo ink, underprint cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1b2566);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — Instrument Serif italic, biennale's only display inflection */
  .caption-word.cap-brand {
    font-style: italic;
  }
  /* numerals / data — the mono voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Geist", ui-monospace, monospace;
    color: color-mix(in srgb, var(--cap-ink, #1b2566) 72%, var(--cap-canvas, #e9e5db));
  }
  /* emphasis — an ember-red hairline underline (the counter-temperature accent) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #e26b4a);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="30"
  data-fps="30"
  data-width="1080"
  data-height="1920"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":3,"start":9.04,"end":11.84,"text":"Vokio décroche à votre place, et dit tout de suite qui elle est.","words":[{"id":"caption-word-0-0","text":"Vokio","start":9.04,"end":9.421},{"id":"caption-word-0-1","text":"décroche","start":9.421,"end":10.03},{"id":"caption-word-0-2","text":"à","start":10.04,"end":10.09},{"id":"caption-word-0-3","text":"votre","start":10.09,"end":10.25},{"id":"caption-word-0-4","text":"place,","start":10.25,"end":10.66},{"id":"caption-word-0-5","text":"et","start":10.66,"end":10.7},{"id":"caption-word-0-6","text":"dit","start":10.7,"end":10.84},{"id":"caption-word-0-7","text":"tout","start":10.9,"end":11.04},{"id":"caption-word-0-8","text":"de","start":11.04,"end":11.14},{"id":"caption-word-0-9","text":"suite","start":11.14,"end":11.33},{"id":"caption-word-0-10","text":"qui","start":11.33,"end":11.49},{"id":"caption-word-0-11","text":"elle","start":11.49,"end":11.56},{"id":"caption-word-0-12","text":"est.","start":11.56,"end":11.72}]},{"id":"caption-group-1","frame":4,"start":14.48,"end":15.49,"text":"Elle comprend la demande,","words":[{"id":"caption-word-1-0","text":"Elle","start":14.48,"end":14.57},{"id":"caption-word-1-1","text":"comprend","start":14.57,"end":14.91},{"id":"caption-word-1-2","text":"la","start":14.91,"end":14.99},{"id":"caption-word-1-3","text":"demande,","start":14.99,"end":15.37}]},{"id":"caption-group-2","frame":4,"start":15.64,"end":17.99,"text":"regarde votre service, pose la réservation.","words":[{"id":"caption-word-2-0","text":"regarde","start":15.64,"end":15.76},{"id":"caption-word-2-1","text":"votre","start":15.76,"end":16.01},{"id":"caption-word-2-2","text":"service,","start":16.02,"end":16.52},{"id":"caption-word-2-3","text":"pose","start":16.52,"end":16.55},{"id":"caption-word-2-4","text":"la","start":16.55,"end":16.98},{"id":"caption-word-2-5","text":"réservation.","start":16.98,"end":17.87}]},{"id":"caption-group-3","frame":5,"start":20.43,"end":23.96,"text":"Le client reçoit sa confirmation. Vous recevez le récapitulatif.","words":[{"id":"caption-word-3-0","text":"Le","start":20.43,"end":20.53},{"id":"caption-word-3-1","text":"client","start":20.61,"end":20.96},{"id":"caption-word-3-2","text":"reçoit","start":20.96,"end":21.38},{"id":"caption-word-3-3","text":"sa","start":21.38,"end":21.52},{"id":"caption-word-3-4","text":"confirmation.","start":21.52,"end":22.46},{"id":"caption-word-3-5","text":"Vous","start":22.46,"end":22.58},{"id":"caption-word-3-6","text":"recevez","start":22.58,"end":22.8},{"id":"caption-word-3-7","text":"le","start":22.8,"end":22.93},{"id":"caption-word-3-8","text":"récapitulatif.","start":22.93,"end":23.84}]}];
  var DURATION = 30;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      // `isLast ? DURATION` suppose que la narration va jusqu'à la dernière
      // image. Ici le CTA est muet, et la phrase du plan 05 restait affichée
      // par-dessus pendant plus de cinq secondes. On la borne comme les autres.
      var end = isLast
        ? Math.min(DURATION, Number(group.end) + 1.1)
        : Math.min(Number(next.start), Number(group.end) + 1.1);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.97 }, { scale: 1, duration: 0.14, ease: "power2.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
</template>
