<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><title>s4-agenda</title></head>
<body>
<!--
  Sous-composition s4-agenda · v2 · film 17,30 → 25,20 s (hôte 7,8999 s, images 519 à 755), hôte #h-s4-agenda.
  Chantier « compositions/s4-agenda.html » du plan v2 (critique.json, plan.chantiers) : LE VRAI AGENDA, LISIBLE,
  SOUS UN POINT QUI FRAPPE LES HEURES. Repris de la v1 (v1/compositions/s4-agenda.html, commit 6d4dbdb) sur le
  contrat v2 de la racine.

  Trois éléments, jamais plus :
    1. le sous-titre, en haut, une page à la fois (DONNEES.pages de la scène, DONNEES.geometrie.sous_titres_haut) :
       · l'agente, Geist 400 72/84 encre, x 90, lignes de base 330 / 414 / 498 : « Laissez-moi voir. » (sortie
         19,60 → 19,7667), puis « Je peux vous proposer | neuf heures, dix heures | ou onze heures. » (sortie 23,10 →
         23,2667), chaque mot monte de sa ligne de base une image avant son attaque mesurée (TEXTE.reveler) ;
       · l'appelant, Instrument Serif Italic 400 64/72 (finition : 96/104 avant), lignes de base 350 / 422 : « À neuf heures, | c’est
         parfait. », ligne par ligne, d'un bloc, une image avant l'attaque du premier mot (0,35 s, comme C2 en s3) ;
         sortie 25,00 → 25,1667. « Euh, bah, » n'est pas écrit : l'appelant hésite sur l'agenda seul.
    2. l'agenda : la vraie colonne jour de app.vokio.fr (assets/captures/agenda-avant.png v2, 1575 × 675, 4,5 px
       film par px CSS = l'échelle de la capture, posée à 1:1 en (70 ; 590) : marge de 70 px, JAMAIS redimensionnée ni zoomée ;
       elle déborde à droite et le cadre la coupe à 1080), avec sa mention accrochée dessous et solidaire
       (« Capture réelle de app.vokio.fr » / « Établissement fictif de démonstration. », Geist 36/48 #6F695F,
       x 90, lignes de base 1313 / 1361). Il monte d'un seul bloc de +520 px à 0, power3.out, en apparaissant (opacité
       0 → 1, power2.out, 0,40 s), de 18,37 à 19,07, pendant le VRAI silence de next_available_slots : sa ligne 09:00
       vient se poser sous le point. Au plus 93 px par image : net, sans filé (arbitrage 2 de la finition).
    3. le point : #point de la RACINE, jamais dessiné ici. Il attend en (x_point ; 09:00) dès 17,80 et frappe
       09:00, 10:00 et 11:00 aux voyelles de « neuf » (620), « dix » (643), « onze » (666), puis revient à 09:00
       sur « À neuf heures, » (contact 731). La scène ne le suit pas : l'agenda est immobile quand il saute ;
       elle VÉRIFIE seulement (si window.POINT existe) que chaque contact tombe sur son filet.

  Finitions de la scène :
    · l'agenda est INVISIBLE avant sa montée ;
    · AUCUN filé (finition du 27/09, arbitrage 2 : le flou d'obturateur faisait des images « effet », étiquettes en
      hachures) : la montée est une translation nette de +520 px, ≤ 93 px par image, et l'objet apparaît pendant
      qu'il monte. Au repos : aucune transformation, opacité 1 : l'image 755 = l'image 756 de s5 ;
    · sorties de page en 5 images pleines, calées sur une image (§ 5) : plus de points isolés à l'avant-dernière ;
    · une seule fonction du temps (proxy de toute la scène) pose visibilité, translation et filé (seek-safe).
  Aucun temps de voix en dur : attaques = DONNEES.mots via TEXTE (pages de DONNEES.pages), géométrie =
  DONNEES.agenda et DONNEES.geometrie, montée = DONNEES.evenements.agenda_monte, sorties aux instants du plan.
  Temps de la timeline : LOCAUX (0 = 17,30 s film), convertis par TEXTE.scene("s4-agenda").

  FORMATS (27-28/09, outils/format.py) : les valeurs ci-dessus sont celles du 9:16, la RÉFÉRENCE (CSS de repli marqué
  « repli 9:16 »). Toute la géométrie est lue dans DONNEES.geometrie (mise-en-page/agenda.json et texte.json, entrée
  du format) et DONNEES.agenda (outils/preparer_agenda.py --format) ; aucun px de format n'est écrit dans ce fichier.
  16:9 (1920 × 1080, YouTube) : sous-titres dans la colonne de lecture, x 144, agente lignes de base 540 / 624 / 708,
  appelant 560 / 632 ; l'agenda à droite, image 1:1 en (1064 ; 234), 856 px visibles, filets 09:00 305,75 · 10:00
  539,75 · 11:00 773,75, gouttière du point x 1305,74 ; la mention Geist 40/52 passe AU-DESSUS de l'image (lignes de
  base 150 / 202, top_dans_l_objet < 0) ; montée +360 → 0. Pendant la montée, la mention traverserait le point : elle
  reste donc à 0 jusqu'à ce qu'elle l'ait dépassé, puis apparaît (§ 6 bis, calculé : rien ne change en 9:16).
  Contrôle : outils/format.py 16x9 … --check, outils/controle_format.py, heurts.py (point × textes, image par image).

  RACCORD s3 → s4 (519) : papier nu et point en vol ; rien de la scène n'est visible avant « Laissez-moi » (527).
  RACCORD s4 → s5 (755 → 756) : agenda au repos, mention, aucun sous-titre, point sur 09:00 ; s5 pose le même
  objet (même CSS : boîte 1575 × 790 en (70 ; 590) sur fond papier, image, mention) : mêmes pixels.
  L'hôte dure 7,8999 s (17,3 + 7,9 = 25,200000000000003 en flottant) : l'image 756 est dessinée par s5 seule.
-->
<template id="s4-agenda-template">
<style>
@font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:block;src:url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2")}
#root{position:absolute;inset:0;overflow:hidden;color:#262019;font-family:"Geist",sans-serif}
/* ── L'objet agenda : image + mention, un seul bloc ──
   Fond papier opaque (#F4F1E8 = #fond de la racine, invisible) : même rendu d'anticrénelage que s5, dont la
   première image reprend la dernière de s4 au pixel. Mêmes valeurs que #s5-agenda (ne pas les changer seules).
   visibility:hidden jusqu'au départ de la montée (DONNEES.evenements.agenda_monte), posée par le script.
   Aucune transformation CSS ici : la translation et le filé sont écrits par la fonction du temps. */
#s4-agenda{position:absolute;left:70px;top:590px;width:1575px;height:790px;background:#F4F1E8;visibility:hidden} /* repli 9:16 : réécrit par le script d'après DONNEES.geometrie */
#s4-capture{position:absolute;left:0;top:0;width:1575px;height:675px;display:block}
/* La mention : Geist 400 36/48, gris texte #6F695F (4,9:1 sur le papier : AA). Ligne de base 36 px sous le haut
   de la ligne (mesuré) : top 1277 → 1313 / 1361, bas 1373 < 1500. Dans l'objet : left 90 − 70 = 20, top 687. */
#s4-mention{position:absolute;left:20px;top:687px;margin:0;font-family:"Geist",sans-serif;font-weight:400;font-style:normal; /* repli 9:16 : réécrit par le script d'après DONNEES.geometrie */
            font-size:36px;line-height:48px;letter-spacing:0;color:#6F695F;white-space:nowrap}
/* ── Le sous-titre : trois pages superposées, une seule visible à la fois ──
   Agente Geist 72/84 (ligne de base 67 px sous le haut) : top 263 → 330 / 414 / 498.
   Appelant Instrument Serif Italic 64/72 (ligne de base mesurée) : lignes de base 350 / 422 (top posé par le script). */
#s4-texte{position:absolute;left:0;top:0;width:1080px;height:600px} /* repli 9:16 : réécrit par le script d'après DONNEES.geometrie */
.s4-agente{position:absolute;left:90px;top:263px;margin:0;font-family:"Geist",sans-serif;font-weight:400;font-style:normal; /* repli 9:16 : réécrit par le script d'après DONNEES.geometrie */
           font-size:72px;line-height:84px;letter-spacing:0;color:#262019;white-space:nowrap}
.s4-appelant{position:absolute;left:90px;top:279px;margin:0;font-family:"Instrument Serif",serif;font-weight:400;font-style:italic; /* repli 9:16 : réécrit par le script d'après DONNEES.geometrie */
             font-size:64px;line-height:72px;letter-spacing:0;color:#262019;white-space:nowrap}
</style>
<div id="root" data-composition-id="s4-agenda" data-width="1080" data-height="1920">
  <!-- L'objet agenda d'abord (dessous), le sous-titre ensuite (la couche de lecture).
       data-layout-allow-overflow : l'agenda entre par le bas et déborde à droite, c'est voulu. -->
  <div id="s4-agenda" data-element="agenda" data-layout-allow-overflow>
    <img id="s4-capture" src="assets/captures/agenda-avant.png" width="1575" height="675" data-layout-allow-overflow
         alt="Colonne jour de app.vokio.fr, samedi, matinée de 09:00 à 11:00">
    <p id="s4-mention"></p>
  </div>
  <div id="s4-texte" data-element="sous-titre">
    <p id="s4-voir" class="s4-agente"></p>
    <p id="s4-creneaux" class="s4-agente"></p>
    <p id="s4-choix" class="s4-appelant"></p>
  </div>
</div>
<script>
(function () {
  const D = window.DONNEES;
  const FPS = D.fps;
  const UNE = 1 / FPS;
  const EPS = 1e-5;
  const sc = TEXTE.scene("s4-agenda");
  const EV = D.evenements;
  const tl = gsap.timeline({ paused: true });
  const r6 = function (v) { return +v.toFixed(6); };
  const derniereImage = r6((D.scenes[sc.id].image_fin - 1) / FPS);          // 25,1667 s : image 755
  function exiger(ok, msg) { if (!ok) throw new Error("s4-agenda : " + msg); }
  function extrait(id) {
    const e = D.dialogue.extraits.find(function (x) { return x.id === id; });
    exiger(e, "extrait " + id + " absent de DONNEES.dialogue");
    return e;
  }
  function els(pose) { return pose.mots.map(function (u) { return u.el; }); }
  function px(v) { return Math.round(v * 1000) / 1000 + "px"; }

  // ── Instants du plan (s film) ──
  // Sorties de page par les masques, power3.in, d'un nombre ENTIER d'images, de l'image du plan à une image :
  // 0,18 s = 5,4 images laissait, à l'avant-dernière image (93 % du temps, 74 % du trajet), les seuls hauts
  // des lettres au-dessus du masque (points des i, jambages de « f », « d », « L ») : des points isolés
  // dispersés sur le papier, vus aux images 593 et 698 du rendu. En 5 images pleines, l'avant-dernière est à
  // 80 % du temps (41 % du trajet : le haut des mots, lisible comme un mot qui s'enfonce), la dernière à 100 %.
  const SORTIE_IMAGES = 5;                      // 0,1667 s (plan : 0,18 s)
  const SORTIE = r6(SORTIE_IMAGES / FPS);
  function surImage(t) { return r6(Math.ceil(t * FPS - 1e-6) / FPS); }   // première image ≥ t
  const SORTIE_VOIR = surImage(19.60);          // « Laissez-moi voir. » : 19,60 (image 588) → 19,7667 (593)
  const SORTIE_CRENEAUX = surImage(23.10);      // « Je peux… onze heures. » : 23,10 (693) → 23,2667 (698, « Euh, »)
  const SORTIE_CHOIX = surImage(24.98);         // « À neuf heures, | c’est parfait. » : 25,00 (750) → 25,1667 (755)
  const REVELE_LIGNE = 0.35;                    // l'appelant, ligne par ligne : comme C2 en s3 (REVELE_C2)
  const DY = 16;                                // montée des mots depuis leur ligne de base (TEXTE.reveler)
  const Y_DEPART = D.geometrie.agenda.y_depart != null ? D.geometrie.agenda.y_depart : 520;   // montée de l'agenda (≤ 93 px par image, sans filé)
  const AM = EV.agenda_monte.t;                 // [18,37 ; 19,07] : le vrai silence de next_available_slots
  const APPARITION = 0.40;                      // s : opacité 0 → 1 pendant la montée (power2.out)
  const PAS_MAX = 95;                           // px par image : au-delà, l'objet sauterait d'une image à l'autre

  // ── 0. L'agenda à sa place, depuis DONNEES.agenda (agenda-geo.json v2, source unique) ──
  const A = D.agenda, IM = A.image, GA = D.geometrie.agenda, GM = GA.mention;
  exiger(A.version === 2 && A.echelle === 4.5, "agenda-geo v2 à 4,5 px par px CSS attendu");
  exiger(/agenda-avant\.png$/.test(IM.fichier) && IM.largeur === 1575 && IM.hauteur === 675,
         "image de l'agenda inattendue : " + IM.fichier + " " + IM.largeur + " × " + IM.hauteur);
  exiger(IM.x === GA.image.x && IM.y === GA.image.y, "DONNEES.agenda et DONNEES.geometrie.agenda divergent");
  const boite = document.getElementById("s4-agenda");
  const capture = document.getElementById("s4-capture");
  const elMention = document.getElementById("s4-mention");
  boite.style.left = IM.x + "px"; boite.style.top = IM.y + "px";
  capture.style.width = IM.largeur + "px"; capture.style.height = IM.hauteur + "px";   // 1:1, jamais redimensionnée
  exiger(capture.getAttribute("width") === String(IM.largeur) && capture.getAttribute("height") === String(IM.hauteur),
         "attributs width / height de la capture ≠ DONNEES.agenda.image");
  elMention.style.left = GM.left_dans_l_objet + "px";
  elMention.style.top = GM.top_dans_l_objet + "px";
  // FORMATS (27/09) : boîte de l'objet, corps de la mention, bas utile et montée lus dans DONNEES.geometrie (9:16 : 1575 × 790,
  // Geist 36/48, 1500, +520 : les valeurs du CSS) ; en 16:9 la mention passe AU-DESSUS de l'image (top_dans_l_objet < 0).
  const CADRE = D.geometrie.cadre || { bas_utile: 1500 };   // repli 9:16 (données d'avant les formats)
  const M_CORPS = GM.corps || 36, M_INTER = GM.interligne || 48;
  if (GA.boite) { boite.style.width = GA.boite.largeur + "px"; boite.style.height = GA.boite.hauteur + "px"; }
  elMention.style.fontSize = M_CORPS + "px"; elMention.style.lineHeight = M_INTER + "px";
  exiger(Math.abs(IM.x + GM.left_dans_l_objet - A.mention.x) < 0.01 &&
         Math.abs(IM.y + GM.top_dans_l_objet + GM.decalage_ligne_de_base - A.mention.lignes_de_base[0]) < 0.01,
         "la mention n'est pas en (x " + A.mention.x + " ; ligne de base " + A.mention.lignes_de_base[0] + ")");
  const mention = TEXTE.poser(elMention, A.mention.lignes, { extrait: null });
  exiger(mention.lignes.length === 2 && A.mention.lignes_de_base[1] - A.mention.lignes_de_base[0] === M_INTER,
         "la mention doit tenir sur 2 lignes de " + M_INTER + " px");
  const basMention = IM.y + GM.top_dans_l_objet + 2 * M_INTER;               // 9:16 : 1373
  exiger(basMention < CADRE.bas_utile, "la mention descend sous y = " + CADRE.bas_utile + " (" + basMention + ")");
  if (GM.top_dans_l_objet >= 0) exiger(basMention <= IM.y + parseFloat(getComputedStyle(boite).height), "la mention sort de l'objet agenda");
  else exiger(basMention <= IM.y, "la mention (au-dessus) mord sur l'image de l'agenda");
  exiger(IM.y + GM.top_dans_l_objet >= (CADRE.haut_utile || 0),
         "la mention monte au-dessus du haut utile (" + (IM.y + GM.top_dans_l_objet) + " < " + CADRE.haut_utile + ")");
  (function () {
    const cm = getComputedStyle(elMention);
    exiger(cm.fontSize === M_CORPS + "px" && cm.lineHeight === M_INTER + "px" && cm.color === "rgb(111, 105, 95)",
           "le CSS de la mention s'écarte de DONNEES.agenda.mention (Geist " + M_CORPS + "/" + M_INTER + " #6F695F)");
  })();

  // ── 1. Les sous-titres : géométrie du contrat, pages de DONNEES.pages ──
  const H = D.geometrie.sous_titres_haut;
  if (H.conteneur) {                          // FORMATS : boîte des sous-titres (9:16 : 1080 × 600, exactement ; 16:9 : le cadre)
    const bt = document.getElementById("s4-texte");
    bt.style.width = H.conteneur.largeur + "px"; bt.style.height = H.conteneur.hauteur + "px";
  }
  document.querySelectorAll(".s4-agente").forEach(function (p) { p.style.top = H.agente.top + "px"; p.style.left = H.agente.x + "px"; });
  document.querySelectorAll(".s4-appelant").forEach(function (p) { p.style.top = H.appelant.top + "px"; p.style.left = H.appelant.x + "px"; });
  [["#s4-voir", H.agente], ["#s4-choix", H.appelant]].forEach(function (x) {
    const cs = getComputedStyle(document.querySelector(x[0]));
    exiger(cs.fontSize === x[1].corps + "px" && cs.lineHeight === x[1].interligne + "px" && cs.fontStyle === x[1].style &&
           String(cs.fontWeight) === String(x[1].graisse), "le CSS de " + x[0] + " s'écarte de DONNEES.geometrie.sous_titres_haut");
  });
  const pages = D.pages.filter(function (p) { return p.scene === sc.id; });
  exiger(pages.length === 3, "3 pages attendues dans DONNEES.pages, " + pages.length + " trouvées");
  const pVoir = pages[0], pCreneaux = pages[1], pChoix = pages[2];
  exiger(pVoir.extrait === "A2A3" && pCreneaux.extrait === "A2A3" && pChoix.extrait === "C3", "pages A2A3, A2A3 puis C3 attendues");
  exiger(pVoir.style === "haut_agente" && pCreneaux.style === "haut_agente" && pChoix.style === "haut_appelant",
         "styles de page inattendus (haut_agente, haut_agente, haut_appelant)");
  // interlignages 84/72 = 1,17 em et 104/96 = 1,08 em < 1,3 : les boîtes de police se chevauchent d'une ligne
  // à l'autre (pas l'encre)
  const voir = TEXTE.poser("#s4-voir", pVoir.lignes, { extrait: pVoir.extrait, depuis: pVoir.depuis, chevauchement: true });
  const creneaux = TEXTE.poser("#s4-creneaux", pCreneaux.lignes, { extrait: pCreneaux.extrait, depuis: pCreneaux.depuis, chevauchement: true });
  const choix = TEXTE.poser("#s4-choix", pChoix.lignes, { extrait: pChoix.extrait, depuis: pChoix.depuis, chevauchement: true });
  [[voir, pVoir], [creneaux, pCreneaux], [choix, pChoix]].forEach(function (x) {
    exiger(x[0].mots.length === x[1].mots.length && x[0].mots.every(function (u, i) {
      return u.texte === x[1].mots[i].texte && u.ligne === x[1].mots[i].ligne && u.mot && u.mot.rang === x[1].mots[i].rang;
    }), "les unités posées ne correspondent plus à DONNEES.pages (relancer outils/construire.py)");
  });
  const eA = extrait("A2A3"), eC3 = extrait("C3");
  // FORMATS (28/09) : au repos, aucune page ne recoupe l'image de l'agenda (9:16 : pages au-dessus de l'image ; 16:9 :
  // pages dans la colonne de lecture, l'image à droite), d'après l'encre MESURÉE par construire.py (DONNEES.pages :
  // largeurs[].encre_x0/x1, mots[].encre_haut/bas autour de leur ligne de base). Données d'avant les formats : sauté.
  const imageVue = [IM.x, IM.y, Math.min(IM.x + IM.largeur, CADRE.largeur || Infinity), IM.y + IM.hauteur];
  pages.forEach(function (p) {
    if (!p.largeurs || !p.mots.every(function (m) { return m.encre_haut != null && m.encre_bas != null; })) return;
    const e = [Math.min.apply(null, p.largeurs.map(function (l) { return l.encre_x0; })),
               Math.min.apply(null, p.mots.map(function (m) { return m.ligne_de_base - m.encre_haut; })),
               Math.max.apply(null, p.largeurs.map(function (l) { return l.encre_x1; })),
               Math.max.apply(null, p.mots.map(function (m) { return m.ligne_de_base + m.encre_bas; }))];
    exiger(!(e[0] < imageVue[2] && imageVue[0] < e[2] && e[1] < imageVue[3] && imageVue[1] < e[3]),
           "la page « " + p.lignes[0] + " » recoupe l'agenda au repos (encre " + e.join(", ") + ")");
  });

  // ── 2. « Laissez-moi voir. » : chaque mot une image avant son attaque ──
  TEXTE.reveler(tl, voir, { scene: sc.id, dy: DY });                          // 16 px, 0,26 s, power3.out
  const tVoirPose = r6(TEXTE.aImage(voir.mots[voir.mots.length - 1].t) - UNE + 0.26);     // la page est entière

  // ── 3. Les créneaux : « neuf », « dix », « onze » montent à l'image qui précède leur attaque ;
  //       le point touche la ligne à leur voyelle (racine, DONNEES.evenements.contact_*) ──
  TEXTE.reveler(tl, creneaux, { scene: sc.id, dy: DY });
  const tJe = r6(TEXTE.aImage(creneaux.mots[0].t) - UNE);                     // 19,7667 : départ de « Je » (image 593)
  const tCreneauxPose = r6(TEXTE.aImage(creneaux.mots[creneaux.mots.length - 1].t) - UNE + 0.26);

  // ── 4. Le choix de l'appelant : ligne par ligne, d'un bloc (comme C2 en s3) ──
  // « À neuf heures, » part à l'image 718 (première image visible 719 = l'attaque du « à », à l'instant où le point
  // quitte 11:00) ; « c’est parfait. » part à 731 (visible à 732, l'image de « c’est »), l'image du contact sur 09:00.
  const lignesChoix = choix.lignes.map(function (ligne, il) {
    const unites = choix.mots.filter(function (u) { return u.ligne === il; });
    return { els: unites.map(function (u) { return u.el; }), t: r6(TEXTE.aImage(unites[0].t) - UNE) };
  });
  lignesChoix.forEach(function (L) {
    tl.fromTo(L.els, { y: DY, opacity: 0 }, { y: 0, opacity: 1, duration: REVELE_LIGNE, ease: "power3.out", immediateRender: true },
              sc.local(L.t));
  });

  // ── 5. Les trois sorties, par les masques, vers le bas, 5 images power3.in ; puis effacées (aucun texte fantôme) ──
  const tAppelant = TEXTE.aImage(TEXTE.mots("C3")[0].debut);                  // 23,2667 : « Euh, » (image 698)
  exiger(SORTIE_VOIR >= tVoirPose - EPS, "« Laissez-moi voir. » sort avant d'être posé");
  exiger(SORTIE_VOIR >= AM[1] - EPS, "« Laissez-moi voir. » sort pendant que l'agenda monte");
  exiger(SORTIE_VOIR + SORTIE <= tJe + UNE + EPS, "« Laissez-moi voir. » est encore là quand « Je » paraît");
  exiger(SORTIE_CRENEAUX >= eA.film_out - EPS, "les créneaux sortent avant que l'agente se taise");
  exiger(SORTIE_CRENEAUX >= tCreneauxPose + 0.3 - EPS, "les créneaux sortent moins de 0,3 s après être posés");
  exiger(SORTIE_CRENEAUX + SORTIE <= tAppelant + UNE + EPS, "les créneaux sont encore là quand l'appelant reprend");
  exiger(lignesChoix[0].t >= SORTIE_CRENEAUX + SORTIE - EPS, "« À neuf heures, » monte avant que les créneaux soient sortis");
  exiger(SORTIE_CHOIX >= lignesChoix[lignesChoix.length - 1].t + REVELE_LIGNE - EPS, "« c’est parfait. » sort avant d'être posé");
  exiger(SORTIE_CHOIX >= eC3.film_out - EPS, "le choix sort avant que l'appelant se taise");
  exiger(SORTIE_CHOIX + SORTIE <= derniereImage + EPS, "le choix sort encore à la dernière image (image 755)");
  exiger(SORTIE_CHOIX - lignesChoix[lignesChoix.length - 1].t >= 0.6 - EPS, "« c’est parfait. » reste moins de 0,6 s");
  // Aucune image intermédiaire au-delà de 45 % du trajet : pas de hauts de lettres isolés.
  exiger(gsap.parseEase("power3.in")(1 - 1 / SORTIE_IMAGES) <= 0.45, "une image de sortie ne laisserait que les hauts des lettres");
  [[voir, SORTIE_VOIR], [creneaux, SORTIE_CRENEAUX], [choix, SORTIE_CHOIX]].forEach(function (x) {
    exiger(Math.abs(x[1] * FPS - Math.round(x[1] * FPS)) < 1e-4, "sortie hors image : " + x[1]);
    TEXTE.sortir(tl, x[0], sc.local(x[1]), { duree: SORTIE, ease: "power3.in" });
    // Effacés une demi-image AVANT la fin : à l'image finale, le mot est parti même si l'arrondi à 1 µs place la
    // fin juste après l'image (755 : 7,866667 > 7,8666667). Sans cela, l'accent de « À » (Instrument Serif, il
    // dépasse de 11 px au-dessus de la boîte de ligne) restait visible sur 3 px à l'image 755 : 130 % de trajet
    // ne le passe pas sous le masque (vu au rendu).
    tl.set(els(x[0]), { opacity: 0 }, sc.local(r6(x[1] + SORTIE - UNE / 2)));
  });

  // ── 6. L'agenda : visibilité, montée et apparition, une seule fonction du temps FILM ──
  // y(t) = Y_DEPART × (1 − power3.out(p)), p = (t − 18,37) / 0,70 (GSAP : power3.out = 1 − (1 − p)⁴) ;
  // opacité = power2.out((t − 18,37) / 0,40) ; invisible jusqu'à 18,37.
  const eMonte = gsap.parseEase("power3.out"), eApp = gsap.parseEase("power2.out");
  const DUREE_MONTEE = r6(AM[1] - AM[0]);
  exiger(Math.abs(DUREE_MONTEE - 0.70) < EPS, "montée de l'agenda ≠ 0,70 s (" + DUREE_MONTEE + ")");
  exiger(AM[0] >= TEXTE.mots("A2A3").find(function (m) { return m.cle === "voir"; }).fin - EPS,
         "l'agenda monte avant que « voir. » se taise");
  exiger(AM[1] <= tJe - 0.5 + EPS, "l'agenda n'est pas au repos 0,5 s avant « Je »");
  exiger(AM[1] <= EV.saut_neuf_envol.t - 1 + EPS, "l'agenda n'est pas au repos 1 s avant le premier saut");
  function yAgenda(tF) {
    if (tF <= AM[0]) return Y_DEPART;
    if (tF >= AM[1]) return 0;
    return Y_DEPART * (1 - eMonte((tF - AM[0]) / DUREE_MONTEE));
  }
  function opAgenda(tF) {
    if (tF <= AM[0]) return 0;
    return Math.min(1, eApp(Math.min(1, (tF - AM[0]) / APPARITION)));
  }
  // ── 6 bis. La mention ne passe jamais SOUS le point (FORMATS, 28/09) ──
  // En 16:9 la mention est AU-DESSUS de l'image : solidaire de l'objet, elle traversait pendant la montée le point
  // qui attend sur 09:00 (images 554 → 557 : « réelle » puis « Établissement » sous le disque ; vu par la planche
  // zoomée et par heurts.py). Tout vient des données, rien du format n'est écrit ici : lignes de la mention au repos =
  // boîtes de ligne (ligne de base − décalage mesuré, interligne), de x mention au bord droit du cadre ; point =
  // (x_point ; filet 09:00), rayon diametre_disque / 2 + MARGE_POINT. Si une image de la montée les fait se recouper,
  // la mention reste à 0 jusqu'à la DERNIÈRE image de recouvrement, puis apparaît (power2.out, APPARITION_MENTION) en
  // finissant sa montée avec l'image : elle est entière avant que l'agenda se pose, donc à l'image 755 = celle de s5.
  // 9:16 : la mention est SOUS l'image, elle ne croise jamais le point : aucune image ne recoupe, l'opacité de la
  // mention n'est jamais écrite (pixels inchangés, prouvé par outils/revue_scene.py identite).
  const MARGE_POINT = 8;                        // px d'air entre le bord du disque et la boîte de ligne de la mention
  const APPARITION_MENTION = 0.30;              // s : opacité 0 → 1 de la mention seule, power2.out
  exiger(D.point && D.point.diametre_disque > 0, "DONNEES.point.diametre_disque absent");
  const R_POINT = D.point.diametre_disque / 2;
  const XP = A.x_point, YP = A.heures["09:00"];
  const lignesMention = A.mention.lignes_de_base.map(function (b) {
    const haut = b - GM.decalage_ligne_de_base;
    return [A.mention.x, haut, CADRE.largeur || Infinity, haut + M_INTER];
  });
  function distanceMention(T, cx, cy) {         // distance du centre (cx ; cy) aux lignes de la mention translatées de T
    return Math.min.apply(null, lignesMention.map(function (b) {
      const dx = Math.max(b[0] - cx, 0, cx - b[2]), dy = Math.max(b[1] + T - cy, 0, cy - (b[3] + T));
      return Math.hypot(dx, dy);
    }));
  }
  let nDernierRecouvrement = null;
  for (let n = Math.round(AM[0] * FPS) + 1; n <= Math.round(AM[1] * FPS); n++) {
    if (distanceMention(yAgenda(r6(n / FPS)), XP, YP) < R_POINT + MARGE_POINT) nDernierRecouvrement = n;
  }
  exiger(distanceMention(0, XP, YP) >= R_POINT + MARGE_POINT, "la mention au repos touche le point posé sur 09:00");
  const T_MENTION = nDernierRecouvrement === null ? null : r6(nDernierRecouvrement / FPS);
  exiger(T_MENTION === null || T_MENTION + APPARITION_MENTION <= AM[1] + EPS,
         "la mention n'est pas entière quand l'agenda se pose (" + T_MENTION + " + " + APPARITION_MENTION + " > " + AM[1] + ")");
  function opMention(tF) {                      // null : la mention suit l'objet (aucune opacité propre)
    if (T_MENTION === null) return null;
    if (tF <= T_MENTION + EPS) return 0;
    return Math.min(1, eApp(Math.min(1, (tF - T_MENTION) / APPARITION_MENTION)));
  }
  function rendreAgenda(tF) {
    const visible = tF > AM[0] + EPS;
    // « inherit » et non « visible » : un enfant en visibility:visible passe outre l'hôte que HyperFrames masque
    // hors de sa fenêtre (en v2, l’agenda restait affiché de 25,20 à la fin sous s5, s6 et s7).
    boite.style.visibility = visible ? "inherit" : "hidden";
    const y = visible ? yAgenda(tF) : Y_DEPART;
    // Au repos : aucune transformation, opacité 1 (les pixels de s5).
    boite.style.transform = Math.abs(y) < 1e-4 ? "none" : "translate(0px, " + px(y) + ")";
    const o = visible ? opAgenda(tF) : 0;
    boite.style.opacity = o >= 1 - 1e-6 ? "" : String(+o.toFixed(4));
    const om = opMention(tF);                   // 9:16 : null, rien d'écrit
    if (om !== null) elMention.style.opacity = om >= 1 - 1e-6 ? "" : String(+om.toFixed(4));
  }
  // Le proxy couvre toute la scène : chaque recherche (seek), dans n'importe quel ordre, repasse par rendreAgenda.
  const proxy = { t: 0 };
  rendreAgenda(sc.film(0));
  tl.to(proxy, { t: sc.duree, duration: sc.duree, ease: "none", onUpdate: function () { rendreAgenda(sc.film(proxy.t)); } }, 0);
  // Contrôles de la montée : aucun saut d'image à image au-delà de PAS_MAX, au repos à 19,07.
  for (let n = Math.round(AM[0] * FPS); n <= Math.round(AM[1] * FPS) + 1; n++) {
    const d = Math.abs(yAgenda(r6(n / FPS)) - yAgenda(r6((n - 1) / FPS)));
    exiger(d <= PAS_MAX, "l'agenda saute de " + d.toFixed(1) + " px à l'image " + n + " (> " + PAS_MAX + ")");
  }
  exiger(yAgenda(AM[1]) === 0 && opAgenda(AM[1]) === 1, "l'agenda n'est pas au repos, entier, à la fin de sa montée");

  // ── 7. Le point de la racine tombe sur les VRAIS filets de cette capture (si lib/point.js est chargé) ──
  if (window.POINT && typeof POINT.etat === "function") {
    const HR = A.heures;
    [[EV.arrivee_agenda.t, HR["09:00"]], [EV.contact_neuf.t, HR["09:00"]], [EV.contact_dix.t, HR["10:00"]],
     [EV.contact_onze.t, HR["11:00"]], [EV.contact_retour_neuf.t, HR["09:00"]], [sc.fin, HR["09:00"]]].forEach(function (c) {
      const e = POINT.etat(c[0]);
      exiger(Math.abs(e.y_sans - c[1]) <= 0.5 && Math.abs(e.x_sans - A.x_point) <= 0.5,
             "le point n'est pas sur le filet " + c[1] + " à " + c[0] + " s (" + e.x_sans + " ; " + e.y_sans + ")");
    });
    // Le point attend l'agenda à sa place, immobile, pendant toute la montée.
    [AM[0], (AM[0] + AM[1]) / 2, AM[1]].forEach(function (t) {
      const e = POINT.etat(t);
      exiger(Math.abs(e.x_sans - A.x_point) <= 0.5 && Math.abs(e.y_sans - HR["09:00"]) <= 0.5, "le point bouge pendant la montée de l'agenda");
    });
    // Le point DESSINÉ (secousse, diamètre et déformation compris) ne touche jamais la mention visible, image par
    // image, de la montée au repos (§ 6 bis) : la supposition « point immobile de diamètre D0 » est vérifiée.
    for (let n = Math.round(AM[0] * FPS) + 1; n <= Math.round(AM[1] * FPS) + 1; n++) {
      const tF = r6(n / FPS), om = opMention(tF);
      if (om === 0) continue;
      const e = POINT.etat(tF), r = e.d * Math.max(e.sx || 1, e.sy || 1) / 2;
      exiger(e.d === 0 || distanceMention(yAgenda(tF), e.x, e.y) >= r,
             "le point touche la mention visible à l'image " + n + " (" + e.x + " ; " + e.y + ")");
    }
  }

  window.__timelines["s4-agenda"] = tl;
})();
</script>
</template>
