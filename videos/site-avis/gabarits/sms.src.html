<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<title>Le SMS d'avis Google · boucle vokio.fr/avis (1:1)</title>
<!-- Boucle de 7 s pour vokio.fr/avis/ (06/10/2026). GÉNÉRÉ par construire.py depuis ce gabarit (gabarits/) + les pièces iPhone
     (Messages iOS) de ../../pub-secretaire/gabarit.html, source unique de l'iPhone : éditer la source, jamais index.html.
     Boucle sans raccord : la première et la dernière image sont le fil vide. Trois éléments au plus : l'iPhone, la bulle,
     la feuille d'avis. -->
<script src="lib/gsap.min.js"></script>
<style>
@font-face{font-family:"Geist";src:url("fonts/geist.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Inter";src:url("fonts/Inter-Variable-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#F4F1E8}
#root{position:relative;width:1080px;height:1080px;overflow:hidden;background:#F4F1E8;-webkit-font-smoothing:antialiased}
/* le bas de l'iPhone se fond dans le fond : seul le haut de l'écran sert */
#cadre{position:absolute;inset:0}
/* fondu du bas par un voile (un mask-image sur tout le cadre rendait des images VIDES en rendu logiciel, 06/10) */
#voile{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(rgba(244,241,232,0),#F4F1E8 92%);pointer-events:none}
__CSS_IPHONE__
#ip-bulle .lien{color:#0A66D0;text-decoration:underline;text-underline-offset:calc(2 * var(--pt))}
#tap{position:absolute;width:calc(46 * var(--pt));height:calc(46 * var(--pt));margin:calc(-23 * var(--pt)) 0 0 calc(-23 * var(--pt));border-radius:50%;background:rgba(10,102,208,.25)}
/* la feuille d'avis (dessinée sobrement : ni logo ni interface copiée) */
#feuille{position:absolute;left:0;width:calc(402 * var(--pt));background:#FFFFFF;border-radius:calc(14 * var(--pt)) calc(14 * var(--pt)) 0 0;box-shadow:0 calc(-6 * var(--pt)) calc(24 * var(--pt)) rgba(0,0,0,.10);text-align:center;font-family:"Inter",sans-serif;color:#202124}
#feuille .poignee{width:calc(36 * var(--pt));height:calc(5 * var(--pt));border-radius:calc(3 * var(--pt));background:#D0D0D4;margin:calc(7 * var(--pt)) auto calc(10 * var(--pt))}
#feuille .nom{font-weight:600;font-size:calc(19 * var(--pt));letter-spacing:-.015em}
#feuille .sous{font-size:calc(13 * var(--pt));color:#5F6368;margin-top:calc(4 * var(--pt))}
#etoiles{display:flex;justify-content:center;gap:calc(10 * var(--pt));margin:calc(11 * var(--pt)) 0 calc(11 * var(--pt))}
#etoiles svg{width:calc(38 * var(--pt));height:calc(38 * var(--pt));overflow:visible}
#etoiles .vide{fill:none;stroke:#BDC1C6;stroke-width:1.6}
#etoiles .plein{fill:#FBBC04;stroke:#FBBC04;stroke-width:1.6;stroke-linejoin:round;transform-origin:50% 55%}
#publier{display:inline-block;background:#1A73E8;color:#fff;font-weight:600;font-size:calc(15 * var(--pt));border-radius:calc(20 * var(--pt));padding:calc(10 * var(--pt)) calc(30 * var(--pt))}
#merci{position:absolute;left:0;right:0;top:calc(34 * var(--pt))}
#merci .rond{width:calc(46 * var(--pt));height:calc(46 * var(--pt));border-radius:50%;background:#E6F4EA;margin:0 auto calc(12 * var(--pt));display:flex;align-items:center;justify-content:center}
#merci .rond svg{width:calc(24 * var(--pt));height:calc(24 * var(--pt))}
#merci .t{font-weight:600;font-size:calc(17 * var(--pt));letter-spacing:-.01em}
#merci .s{font-size:calc(13 * var(--pt));color:#5F6368;margin-top:calc(4 * var(--pt))}
</style>
</head>
<body>
<div id="root" data-composition-id="avis-sms" data-start="0" data-width="1080" data-height="1080" data-duration="7">
<div id="cadre">
__HTML_IPHONE__
</div>
<div id="voile"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__pub = { erreurs: [], pret: false };
(function () {
  const T = 7;
  const $ = (s) => document.querySelector(s);
  const P3o = "power3.out";
  function exiger(c, msg) { if (!c) { window.__pub.erreurs.push(msg); console.error("avis-sms : " + msg); } }
__ARRONDI__
  function construire() {
    const tl = gsap.timeline({ paused: true });
    const ftTl = (el, de, a, t) => tl.fromTo(el, de, Object.assign({ immediateRender: false }, a), t);
    // la pièce iPhone fait entrer et sortir le téléphone : ici il est là dès l'image 0 (boucle) et ne sort jamais,
    // donc ces deux mouvements ne sont PAS créés (les créer puis les retirer du timeline rendait une vidéo vide)
    let ft = (el, de, a, t) => (el && el.id === "sms") ? null : ftTl(el, de, a, t);
    const montrer = () => {};
    // paramètres lus par la pièce iPhone (même interface que la pub multi-métiers)
    const ip = { entree: 0, bulle: 0.55, sortie: 7, K: 1.9, yE: 64, heure: "14:30",
                 txt: "Bonjour Julie, merci pour votre visite. Votre avis compte beaucoup pour Institut Camélia : vokio.fr/a/k3Fz7Q" };
__JS_IPHONE__
    ft = ftTl;
    const K = ip.K, ecr = $("#ip-ecran"), bulle = $("#ip-bulle");
    // le lien du SMS, souligné comme sur iOS
    bulle.innerHTML = bulle.textContent.replace("vokio.fr/a/k3Fz7Q", '<span class="lien">vokio.fr/a/k3Fz7Q</span>');
    const lien = $("#ip-bulle .lien");
    const rE = ecr.getBoundingClientRect(), rL = lien.getBoundingClientRect(), k = $("#root").getBoundingClientRect().width / 1080;
    const tap = document.createElement("div"); tap.id = "tap"; ecr.appendChild(tap);
    Object.assign(tap.style, { left: ((rL.left + rL.width * 0.55 - rE.left) / k) + "px", top: ((rL.top + rL.height / 2 - rE.top) / k) + "px" });
    gsap.set(tap, { scale: 0.3, opacity: 0 });
    ft(tap, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: P3o }, 1.85);
    ft(tap, { scale: 1, opacity: 1 }, { scale: 1.8, opacity: 0, duration: 0.42, ease: "power2.out" }, 2.03);
    ft(lien, { backgroundColor: "rgba(10,102,208,0)" }, { backgroundColor: "rgba(10,102,208,.14)", duration: 0.12 }, 1.9);
    ft(lien, { backgroundColor: "rgba(10,102,208,.14)" }, { backgroundColor: "rgba(10,102,208,0)", duration: 0.3 }, 2.25);

    // la feuille d'avis monte sous la bulle, dans la partie visible de l'écran
    const fe = document.createElement("div"); fe.id = "feuille";
    fe.innerHTML = '<div class="poignee"></div><div id="note"><p class="nom">Institut Camélia</p><p class="sous">Partagez votre avis sur Google</p>' +
      '<div id="etoiles"></div><span id="publier">Publier</span></div>' +
      '<div id="merci"><div class="rond"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#1E8E3E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '<p class="t">Merci, votre avis est publié</p><p class="s">Institut Camélia · à l’instant</p></div>';
    ecr.appendChild(fe);
    const ET = "M12 2.6l2.85 5.9 6.45.85-4.72 4.48 1.2 6.4L12 17.1l-5.78 3.13 1.2-6.4L2.7 9.35l6.45-.85z";
    const pleins = [];
    for (let i = 0; i < 5; i++) {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24");
      s.innerHTML = '<path class="vide" d="' + ET + '"/><path class="plein" d="' + ET + '"/>';
      $("#etoiles").appendChild(s); pleins.push(s.querySelector(".plein"));
    }
    const yF = 312 * K;                                    // haut de la feuille, en px d'écran
    fe.style.top = yF + "px"; fe.style.height = (874 * K - yF) + "px";
    // le bouton « Publier », feuille montée, doit rester dans la zone nette (90 % du cadre, au-dessus du fondu)
    { const r0 = $("#root").getBoundingClientRect(), rb = $("#publier").getBoundingClientRect();
      const bas = (rb.bottom - r0.top) / k; exiger(bas <= 1080 * 0.9, "« Publier » dans le fondu (" + Math.round(bas) + " px)");
      const rbu = $("#ip-forme-bulle").getBoundingClientRect(), rf = fe.getBoundingClientRect();
      exiger(rbu.bottom + 6 * k <= rf.top, "la feuille couvre la bulle (" + Math.round((rbu.bottom - rf.top) / k) + " px)"); }
    gsap.set(fe, { yPercent: 100 }); /* mesure faite au-dessus, feuille à sa place */ gsap.set(pleins, { scale: 0, opacity: 0 }); gsap.set("#merci", { autoAlpha: 0 });
    ft(fe, { yPercent: 100 }, { yPercent: 0, duration: 0.55, ease: P3o }, 2.3);
    pleins.forEach((p, i) => ft(p, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, 2.95 + i * 0.16));
    const pub = $("#publier");
    ft(pub, { scale: 1 }, { scale: 0.94, duration: 0.09, ease: "power1.out" }, 3.95);
    ft(pub, { scale: 0.94 }, { scale: 1, duration: 0.14, ease: "power1.out" }, 4.04);
    ft("#note", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.22 }, 4.2);
    ft("#merci", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: P3o }, 4.35);
    // retour au fil vide : la boucle reprend sans raccord
    ft(fe, { yPercent: 0 }, { yPercent: 100, duration: 0.45, ease: "power2.in" }, 5.45);
    ft([bulle, "#ip-forme", "#ip-mention"], { opacity: 1 }, { opacity: 0, duration: 0.35 }, 5.85);
    tl.set({}, {}, T);
    exiger(Math.abs(tl.duration() - T) < 0.02, "durée du timeline " + tl.duration().toFixed(2));
    window.__avis = { chapitres: [0, 7] };
    window.__timelines["avis-sms"] = tl;
    window.__pub.pret = true;
  }
  Promise.all(["52px Geist", "52px Inter"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(construire);
})();
</script>
</body>
</html>
