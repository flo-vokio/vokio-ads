<template>
  <style>
    @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2");}
    @font-face{font-family:"Instrument Serif";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");}
    @font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:block;src:url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");}

    /* frame root — styled by #root (never by a class) */
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
      font-family: "Geist", sans-serif;
      color: #262019;
    }

    /* ---------- ground : paper + sun bloom + subordinate ember counter-bloom ---------- */
    .f03-decroche-paper {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 24% at 50% 16.5%,
          rgba(248, 214, 155, 0.30) 0%,
          rgba(245, 198, 119, 0.15) 44%,
          rgba(244, 241, 232, 0) 76%),
        #F4F1E8;
    }

    /* ---------- the brand mark : five bars, the wave ---------- */
    .f03-decroche-wave {
      position: absolute;
      top: 12.04cqw;
      left: 50%;
      margin-left: -20.37cqw;
      width: 40.74cqw;
      height: 40.74cqw;
    }
    .f03-decroche-wave svg { display: block; width: 100%; height: 100%; overflow: visible; }

    /* ---------- the thread : two blocks on paper, hairline speaker rules ---------- */
    .f03-decroche-agent {
      position: absolute;
      top: 55.56cqw;
      left: 8.33cqw;
      width: 67.59cqw;
      padding: 0.46cqw 1.02cqw 0.46cqw 3.24cqw;
      border-left: 1px solid #262019;
    }
    .f03-decroche-client {
      position: absolute;
      top: 106.48cqw;
      right: 8.33cqw;
      width: 61.11cqw;
      padding: 0.46cqw 3.24cqw 0.46cqw 1.02cqw;
      border-right: 1px solid rgba(38, 32, 25, 0.28);
      text-align: right;
    }

    .f03-decroche-label {
      font-family: "Geist Mono", monospace;
      font-weight: 600;
      font-size: 1.85cqw;
      line-height: 1.2;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(38, 32, 25, 0.52);
    }
    .f03-decroche-agent .f03-decroche-label { margin-bottom: 1.85cqw; }
    .f03-decroche-client .f03-decroche-label { margin-bottom: 1.67cqw; }

    .f03-decroche-say {
      font-family: "Geist", sans-serif;
      font-weight: 400;
      color: #262019;
    }
    .f03-decroche-l1 { font-size: 4.44cqw; line-height: 1.30; }
    .f03-decroche-l2 { font-size: 4.44cqw; line-height: 1.34; margin-top: 1.30cqw; }
    .f03-decroche-l3 { font-size: 3.52cqw; line-height: 1.30; }

    .f03-decroche-w1,
    .f03-decroche-w2,
    .f03-decroche-w3 { display: inline-block; }
    .f03-decroche-g {
      display: inline-block;
      transform-origin: 50% 50%;
      text-shadow: 0 0 0 rgba(239, 164, 36, 0);
    }
  </style>

  <div id="root" data-composition-id="03-decroche" data-width="1080" data-height="1920">

    <div id="03-decroche-paper" class="f03-decroche-paper clip"
         data-start="0" data-duration="5.4" data-track-index="0"></div>

    <div id="03-decroche-wave" class="f03-decroche-wave clip"
         data-start="0" data-duration="5.4" data-track-index="1">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line id="03-decroche-bar-0" class="f03-decroche-bar" x1="12" y1="8"  x2="12" y2="50" stroke="#262019" stroke-width="5.5" stroke-linecap="round"></line>
        <line id="03-decroche-bar-1" class="f03-decroche-bar" x1="22" y1="24" x2="22" y2="50" stroke="#262019" stroke-width="5.5" stroke-linecap="round"></line>
        <line id="03-decroche-bar-2" class="f03-decroche-bar" x1="32" y1="38" x2="32" y2="50" stroke="#EFA424" stroke-width="5.5" stroke-linecap="round"></line>
        <line id="03-decroche-bar-3" class="f03-decroche-bar" x1="42" y1="24" x2="42" y2="50" stroke="#262019" stroke-width="5.5" stroke-linecap="round"></line>
        <line id="03-decroche-bar-4" class="f03-decroche-bar" x1="52" y1="8"  x2="52" y2="50" stroke="#262019" stroke-width="5.5" stroke-linecap="round"></line>
      </svg>
    </div>

    <div id="03-decroche-agent" class="f03-decroche-agent clip"
         data-start="0" data-duration="5.4" data-track-index="2">
      <div id="03-decroche-agent-label" class="f03-decroche-label f03-decroche-agent-label">Vokio</div>
      <div class="f03-decroche-say f03-decroche-l1"><span class="f03-decroche-w1">Plomberie</span> <span class="f03-decroche-w1">Azur,</span> <span class="f03-decroche-w1">bonjour.</span></div>
      <div class="f03-decroche-say f03-decroche-l2"><span class="f03-decroche-w2"><span class="f03-decroche-g" data-word="je">Je</span></span> <span class="f03-decroche-w2"><span class="f03-decroche-g" data-word="suis">suis</span></span> <span class="f03-decroche-w2"><span class="f03-decroche-g" data-word="lassistante">l'assistante</span></span> <span class="f03-decroche-w2"><span class="f03-decroche-g" data-word="vocale">vocale</span></span> <span class="f03-decroche-w2"><span class="f03-decroche-g" data-word="de">de</span></span> <span class="f03-decroche-w2"><span class="f03-decroche-g" data-word="lentreprise">l'entreprise.</span></span></div>
    </div>

    <div id="03-decroche-client" class="f03-decroche-client clip"
         data-start="0" data-duration="5.4" data-track-index="3">
      <div class="f03-decroche-label">Le client</div>
      <div class="f03-decroche-say f03-decroche-l3"><span class="f03-decroche-w3">J'ai une fuite sous l'évier.</span></div>
    </div>

  </div>

  <script>
    (function () {
      var D = 5.4;
      var tl = gsap.timeline({ paused: true });

      /* ============================================================
         Scene 1 (0.00-1.00) — the five bars arrive from the centre
         center-outward-expansion : shared origin x=32, out-ease only,
         stagger runs centre -> outer.
         ============================================================ */
      var BAR_X = [12, 22, 32, 42, 52];
      var ORDER = [2, 1, 3, 0, 4];           /* centre first, then outward */
      var bars = [];
      for (var i = 0; i < 5; i++) bars.push(document.getElementById("03-decroche-bar-" + i));

      for (var k = 0; k < ORDER.length; k++) {
        var bi = ORDER[k];
        tl.fromTo(
          bars[bi],
          { x: 32 - BAR_X[bi], scaleY: 0.42, opacity: 0, transformOrigin: "50% 100%" },
          { x: 0, scaleY: 1, opacity: 1, duration: 0.50, ease: "power3.out" },
          0.04 + k * 0.055
        );
      }

      /* ============================================================
         svg-icon-enrichment — the mark SPEAKS.
         Finite, hand-authored keyframe table of bar heights (y1 only,
         y2 stays 50). One linear driver interpolates it; no loop, no
         repeat, no rAF, fully seek-safe.
         Rest silhouette = the brand mark itself [8,24,38,24,8].
         ============================================================ */
      var WAVE_KEYS = [
        [0.00, [8.0, 24.0, 38.0, 24.0, 8.0]],
        [0.49, [8.0, 24.0, 38.0, 24.0, 8.0]],
        [0.60, [18.0, 10.0, 14.0, 12.0, 20.0]],
        [0.70, [10.0, 20.0, 8.0, 22.0, 12.0]],
        [0.82, [24.0, 12.0, 20.0, 10.0, 24.0]],
        [0.95, [14.0, 26.0, 12.0, 24.0, 10.0]],
        [1.08, [20.0, 10.0, 26.0, 14.0, 18.0]],
        [1.22, [10.0, 18.0, 10.0, 20.0, 12.0]],
        [1.36, [22.0, 28.0, 18.0, 26.0, 22.0]],
        [1.52, [27.0, 31.0, 25.0, 31.0, 27.0]],
        [1.68, [29.0, 33.0, 29.0, 33.0, 29.0]],
        [1.80, [12.0, 20.0, 10.0, 18.0, 14.0]],
        [1.94, [22.0, 10.0, 20.0, 12.0, 20.0]],
        [2.08, [10.0, 24.0, 14.0, 22.0, 10.0]],
        [2.22, [18.0, 12.0, 8.0, 14.0, 18.0]],
        [2.36, [24.0, 20.0, 22.0, 18.0, 24.0]],
        [2.50, [12.0, 18.0, 10.0, 20.0, 12.0]],
        [2.64, [20.0, 26.0, 18.0, 24.0, 20.0]],
        [2.80, [24.0, 30.0, 26.0, 30.0, 24.0]],
        [3.05, [8.0, 24.0, 38.0, 24.0, 8.0]],
        [3.70, [8.6, 24.5, 37.4, 23.5, 8.5]],
        [4.35, [7.5, 23.6, 38.5, 24.6, 7.6]],
        [5.00, [8.5, 24.4, 37.6, 23.6, 8.4]],
        [5.40, [8.0, 24.0, 38.0, 24.0, 8.0]]
      ];

      function waveAt(t) {
        var last = WAVE_KEYS.length - 1;
        if (t <= WAVE_KEYS[0][0]) return WAVE_KEYS[0][1];
        if (t >= WAVE_KEYS[last][0]) return WAVE_KEYS[last][1];
        var idx = 0;
        for (var j = 0; j < last; j++) {
          if (t >= WAVE_KEYS[j][0] && t <= WAVE_KEYS[j + 1][0]) { idx = j; break; }
        }
        var t0 = WAVE_KEYS[idx][0], t1 = WAVE_KEYS[idx + 1][0];
        var a = WAVE_KEYS[idx][1], b = WAVE_KEYS[idx + 1][1];
        var p = (t - t0) / (t1 - t0);
        var s = p * p * (3 - 2 * p);           /* smoothstep — deterministic */
        var out = [];
        for (var m = 0; m < 5; m++) out.push(a[m] + (b[m] - a[m]) * s);
        return out;
      }

      var waveDriver = { t: 0 };
      tl.to(waveDriver, {
        t: D,
        duration: D,
        ease: "none",
        onUpdate: function () {
          var h = waveAt(waveDriver.t);
          for (var n = 0; n < 5; n++) bars[n].setAttribute("y1", h[n].toFixed(2));
        }
      }, 0);

      /* ============================================================
         Scene 2 (1.00-2.40) — the agent block unfolds under the wave
         card-morph-anchor : ONE tween carries uniform scale + the
         paint-only channel (backgroundColor ink-wash -> bare paper),
         long power3 deceleration, anchored at its own top edge.
         ============================================================ */
      tl.fromTo(
        ".f03-decroche-agent",
        {
          opacity: 0,
          scale: 0.62,
          transformOrigin: "50% 0%",
          backgroundColor: "rgba(38, 32, 25, 0.07)"
        },
        {
          opacity: 1,
          scale: 1,
          backgroundColor: "rgba(38, 32, 25, 0)",
          duration: 0.62,
          ease: "power3.out"
        },
        1.00
      );

      tl.fromTo(".f03-decroche-agent-label",
        { opacity: 0 },
        { opacity: 1, duration: 0.38, ease: "power2.out" },
        1.02);

      /* first half of the line, on the words (1.00 - 1.36) */
      tl.fromTo(".f03-decroche-w1",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.30, ease: "power3.out", stagger: 0.075 },
        1.04);

      /* the transparency notice, on the words (1.80 - 2.80) */
      tl.fromTo(".f03-decroche-w2",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.10 },
        1.80);

      /* ============================================================
         asr-keyword-glow — the solar emphasis walks the transparency
         sentence, full on "l'assistante" at exactly 2.45s.
         One linear driver, all words, text-shadow on the glyph.
         ============================================================ */
      var TIMINGS = {
        je:           { start: 2.02, end: 2.12 },
        suis:         { start: 2.14, end: 2.26 },
        lassistante:  { start: 2.33, end: 2.62 },   /* attack 0.12 -> peak at 2.45 */
        vocale:       { start: 2.66, end: 2.84 },
        de:           { start: 2.88, end: 2.96 },
        lentreprise:  { start: 2.99, end: 3.25 }
      };
      var ATTACK_DUR = 0.12;
      var RELEASE = 0.32;
      var REST_LEVEL = 0.15;
      var MAX_BLUR = 22;
      var MAX_SCALE_BOOST = 0.032;

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      var glowWords = document.querySelectorAll(".f03-decroche-g");
      var glowDriver = { t: 0 };
      tl.to(glowDriver, {
        t: D,
        duration: D,
        ease: "none",
        onUpdate: function () {
          for (var q = 0; q < glowWords.length; q++) {
            var el = glowWords[q];
            var tm = TIMINGS[el.getAttribute("data-word")];
            if (!tm) continue;
            var env = envelope(glowDriver.t, tm.start, tm.end);
            el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(2) +
              "px rgba(239, 164, 36, " + (0.85 * env).toFixed(3) + ")";
            el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
          }
        }
      }, 0);

      /* ============================================================
         Scene 3 (2.40-5.40) — the client answers, then everything
         holds. Plain entrance, no spring, no overshoot.
         ============================================================ */
      tl.fromTo(".f03-decroche-client",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" },
        3.00);

      window.__timelines["03-decroche"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
