    const plume = { u: 0 };
    tl.fromTo(plume, { u: 0 }, { u: 1, duration: TT.plume_fin - TT.plume, ease: "none", immediateRender: false,
      onUpdate: () => encre(stylo.x0 + (stylo.x1 + L_ENCRE - stylo.x0) * EASE_PLUME(plume.u)) }, TT.plume);
    tl.call(() => encre(stylo.x1 + L_ENCRE), null, TT.plume_fin - 0.001);
    tl.call(() => { mot.style.webkitMaskImage = "none"; mot.style.maskImage = "none"; }, null, TT.plume_fin + 0.001);
    // promesse (v8, sans le « Vokio. » que le logo dit déjà) puis l'appel à l'action (v9)
    const m8 = motsDe("v8").slice(1), prom = $("#promesse");
    prom.innerHTML = m8.map((w) => '<span class="w"><span class="i">' + w.texte + "</span></span>").join(" ");
    montrer(prom, m8[0].t - 0.05, null);
    [].forEach.call(prom.querySelectorAll(".i"), (sp, q) => { gsap.set(sp, { yPercent: 150 }); ft(sp, { yPercent: 150 }, { yPercent: 0, duration: 0.28, ease: P3o }, m8[q].t - 0.03); });
    const m9 = motsDe("v9"), cta = $("#cta");
    cta.innerHTML = m9.map((w) => '<span class="w"><span class="i' + (w.texte === "vokio.fr" ? " url" : "") + '">' + w.texte + "</span></span>").join(" ").replace(' <span class="w"><span class="i url">', '<br><span class="w"><span class="i url">');
    montrer(cta, m9[0].t - 0.05, null);
    [].forEach.call(cta.querySelectorAll(".i"), (sp, q) => { gsap.set(sp, { yPercent: 150 }); ft(sp, { yPercent: 150 }, { yPercent: 0, duration: 0.3, ease: P3o }, m9[q].t - 0.03); });
    const off = $("#offre"); montrer(off, V("v9")[1] + 0.1, null); entre(off, V("v9")[1] + 0.1, 24);
    exiger(boite(off).y + boite(off).h <= 1250, "l'offre descend sous 1250");

    // ================= LE POINT
    const point = $("#point");
    const c = (el) => { const b = boite(el); return { x: b.x + b.w / 2, y: b.y + b.h / 2, s: b.w }; };
    const P1 = c($("#t1-pt")), Pv1 = c($("#v1-pt")), Pv7 = c($("#v7-pt")), PI = c($("#mot-pt"));
    gsap.set(point, { x: P1.x, y: P1.y, xPercent: -50, yPercent: -50, scale: P1.s / 44 });
    // il bat à chaque décroché : c'est lui qui répond
    decs.forEach(function (s) {
      ft(point, { scale: P1.s / 44 }, { scale: P1.s / 44 * 1.6, duration: 0.08, ease: "power2.out" }, s.film[0]);
      ft(point, { scale: P1.s / 44 * 1.6 }, { scale: P1.s / 44, duration: 0.25, ease: "power2.in" }, s.film[0] + 0.08);
    });
    ft(point, { scale: P1.s / 44 }, { scale: 0, duration: 0.18, ease: "power2.in" }, finAcc);
    // point final de « répondu. »
    const tRep = m1[m1.length - 1].t1 - 0.05;
    tl.set(point, { x: Pv1.x, y: Pv1.y }, tRep - 0.01);
    ft(point, { scale: 0 }, { scale: Pv1.s / 44, duration: 0.2, ease: P3o }, tRep);
    let px = Pv1.x, py = Pv1.y, ps = Pv1.s, tp = tRep + 0.2;
    pts.sort((a, b) => a.t - b.t);
    pts.forEach(function (q, k) {
      const t = Math.max(q.t, tp);
      if (q.renait || q.ligne && Math.abs(q.y - py) > 20) {
        const te = q.eteint != null ? Math.max(q.eteint, tp) : t;
        ft(point, { scale: ps / 44 }, { scale: 0, duration: 0.1, ease: "power2.in" }, te);
        tl.set(point, { x: q.x, y: q.y }, Math.max(te + 0.1, t - 0.001));
        ft(point, { scale: 0 }, { scale: q.s / 44, duration: 0.16, ease: P3o }, Math.max(te + 0.1, t));
        px = q.x; py = q.y; ps = q.s; tp = Math.max(te + 0.1, t) + 0.16; return;
      }
      const d = q.d || 0.3;
      ft(point, { x: px, y: py, scale: ps / 44 }, { x: q.x, y: q.y, scale: q.s / 44, duration: d, ease: P3o }, t);
      px = q.x; py = q.y; ps = q.s; tp = t + d;
    });
    // il quitte l'espace, attend le mur, puis devient le point final de « métier. »
    const tMet = mFin[mFin.length - 1].t1 - 0.05;
    exiger(tMet > tp, "le point arrive sur « métier. » avant d'avoir fini");
    ft(point, { scale: ps / 44 }, { scale: 0, duration: 0.12, ease: "power2.in" }, Math.max(tp, finMur));
    tl.set(point, { x: Pv7.x, y: Pv7.y }, tMet - 0.01);
    ft(point, { scale: 0 }, { scale: Pv7.s / 44, duration: 0.2, ease: P3o }, tMet);
    // signature
    exiger(TT.plume - 0.3 > tMet + 0.3, "pas le temps de poser « métier. »");
    ft(point, { x: Pv7.x, y: Pv7.y, scale: Pv7.s / 44 }, { x: stylo.x0, y: stylo.y, scale: 1, duration: 0.3, ease: P3io }, TT.plume - 0.3);
    const xPlume = { u: 0 };
    tl.fromTo(xPlume, { u: 0 }, { u: 1, duration: TT.plume_fin - TT.plume, ease: "none", immediateRender: false,
      onUpdate: () => gsap.set(point, { x: stylo.x0 + (stylo.x1 - stylo.x0) * EASE_PLUME(xPlume.u), y: stylo.y }) }, TT.plume);
    const sI = PI.s / 44, BOND = 110;
    ft(point, { x: stylo.x1, scale: 1 }, { x: PI.x, scale: sI * 1.15, duration: TT.sol - TT.la, ease: "power2.out" }, TT.la);
    ft(point, { y: stylo.y }, { y: PI.y - BOND, duration: TT.sol - TT.la, ease: "power2.out" }, TT.la);
    ft(point, { y: PI.y - BOND }, { y: PI.y - BOND - 8, duration: 0.16, ease: "sine.inOut" }, TT.sol);
    ft(point, { y: PI.y - BOND - 8, scale: sI * 1.15 }, { y: PI.y, scale: sI, duration: TT.re - TT.sol - 0.16, ease: "power2.in" }, TT.sol + 0.16);
    ft(point, { scaleX: sI, scaleY: sI }, { scaleX: sI * 1.28, scaleY: sI * 0.74, duration: 0.067, ease: "power2.out" }, TT.re);
    ft(point, { scaleX: sI * 1.28, scaleY: sI * 0.74 }, { scaleX: sI, scaleY: sI, duration: 0.1, ease: "power2.out" }, TT.re + 0.067);

    fenetres.forEach(function (f) {
      const el = f[0], t0 = f[1], t1 = f[2];
      if (t0 > 0.001) { gsap.set(el, { display: "none" }); tl.set(el, { display: "" }, t0 - 0.001); }
      if (t1 != null) tl.set(el, { display: "none" }, t1);
    });
    exiger(tl.duration() <= T + 0.05, "le timeline dépasse la durée (" + tl.duration().toFixed(2) + ")");
    window.__pub.pages = pages.map((p) => ({ t_in: +p.t_in.toFixed(2), t_out: +p.t_out.toFixed(2), texte: p.mots.map((w) => w.texte).join(" ") }));
    window.__timelines["pub"] = tl;
    window.__pub.pret = true;
  }
  Promise.all(["52px Geist", "52px 'Geist Mono'", "52px 'Instrument Serif'", "italic 52px 'Instrument Serif'", "52px Inter"].map((f) => document.fonts.load(f)))
    .then(() => Promise.all([].map.call(document.images, (im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))))
    .then(() => document.fonts.ready).then(construire);
})();
</script>
</body>
</html>
