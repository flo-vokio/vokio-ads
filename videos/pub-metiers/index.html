window.__timelines = window.__timelines || {};

  const P3o = "power3.out", P3io = "power3.inOut";

  function boite(el) { const r = el.getBoundingClientRect(), r0 = $("#root").getBoundingClientRect(), k = r0.width / 1080;
    return { x: (r.left - r0.left) / k, y: (r.top - r0.top) / k, w: r.width / k, h: r.height / k }; }
  const seg = (n) => D.segments.find((s) => s.nom === n);

  const tMot = (n, texte) => { const w = motsDe(n).find((w) => w.texte.replace(/[.,…!?]/g, "") === texte); exiger(!!w, "mot absent : " + n + " " + texte); return w ? w.t : 0; };
  function arrondi(x, y, w, h, r, xi) {
    const rad = (d) => d * Math.PI / 180, f = (v) => +v.toFixed(3);
    const p = Math.min((1 + xi) * r, Math.min(w, h) / 2), arc = 90 * (1 - xi);
    const lArc = Math.sin(rad(arc / 2)) * r * Math.SQRT2, alpha = (90 - arc) / 2, p34 = r * Math.tan(rad(alpha / 2));
    const beta = 45 * xi, c = p34 * Math.cos(rad(beta)), d = c * Math.tan(rad(beta)), b = (p - lArc - c - d) / 3, a = 2 * b;

    const pts = [];          // cibles du point {t, x, y, s (diamètre px), d (durée), renait}

    // ================= ACCROCHE (05/10, idée de Florian) : le mur des 22 métiers est là dès l'image 0, sous

    montrer(mur, 0, finAcc + 0.25); sort(mur, finAcc);

    const ptsMur = [];
    motsDe("v0").forEach(function (w) {

      const b = boite(d);

    // ================= VOIX OFF : pages du récit, mots révélés quand ils sont dits
    const pages = [];
    function page(n, mots, cls, top, t_out, idPt) {
